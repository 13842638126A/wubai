<body>
<div class="warn">⚠️重要声明：彩票开奖完全随机，本工具仅为奇门模型统计回测研究工具，不具备预测能力，购彩理性娱乐。</div>
<h1>奇门遁甲彩票推演系统 v2.0（修正版）</h1>

<div class="game-tabs">

<script>

// ========== 游戏配置 ==========
let currentGame="ssq";
const GAME_CFG={
ssq:{name:"双色球",frontMax:33,backMax:16,frontPick:6,backPick:1,maxFront:16,maxBack:6,drawDays:[0,2,4]},
dlt:{name:"大乐透",frontMax:35,backMax:12,frontPick:5,backPick:2,maxFront:16,maxBack:6,drawDays:[1,3,6]}
};

// ========== 硬编码权重（生子救母体系）==========
const W={shengWo:2,woSheng:1,keWo:-2,woKe:-1,biHe:3,kongWang:-8,chong:-7,liuHe:5,xingShengGong:9,xingKeGong:-9,fuYin:10,wangJia:8};

// ========== 常量 ==========
const tianGan=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const diZhi=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const ganWuxing={"甲":"木","乙":"木","丙":"火","丁":"火","戊":"土","己":"土","庚":"金","辛":"金","壬":"水","癸":"水"};
const chongDizhi={"子":"午","丑":"未","寅":"申","卯":"酉","辰":"戌","巳":"亥","午":"子","未":"丑","申":"寅","酉":"卯","戌":"辰","亥":"巳"};
const xunKongTable={"甲子旬":["戌","亥"],"甲戌旬":["申","酉"],"甲申旬":["午","未"],"甲午旬":["辰","巳"],"甲辰旬":["寅","卯"],"甲寅旬":["子","丑"]};
const wuxingSheng={"水":"金","金":"土","土":"火","火":"木","木":"水"};
const wuxingKe={"水":"火","火":"金","金":"木","木":"土","土":"水"};
const wuxingMap={
"水":{shengWo:"金",woSheng:"木",keWo:"土",woKe:"火",tong:"水"},
"木":{shengWo:"水",woSheng:"火",keWo:"金",woKe:"土",tong:"木"},
"火":{shengWo:"木",woSheng:"土",keWo:"水",woKe:"金",tong:"火"},
"土":{shengWo:"火",woSheng:"金",keWo:"木",woKe:"水",tong:"土"},
"金":{shengWo:"土",woSheng:"水",keWo:"火",woKe:"木",tong:"金"}
};
const XING_WUXING={"蓬":"水","芮":"土","冲":"木","辅":"木","禽":"土","心":"金","柱":"金","任":"土","英":"火"};
const XING_FULL={"蓬":"天蓬","芮":"天芮","冲":"天冲","辅":"天辅","禽":"天禽","心":"天心","柱":"天柱","任":"天任","英":"天英"};
const SHEN_LIST=["值符","螣蛇","太阴","六合","白虎","玄武","九地","九天"];
const GONG_ORDER=[1,2,3,4,6,7,8,9];
const palaceMeta={
1:{name:"坎",tianXian:[1],houTian:[6],origXing:"蓬",origMen:"休",wuXing:"水",dizhi:["子"],jiXiong:"吉"},
2:{name:"坤",tianXian:[2],houTian:[8],origXing:"芮",origMen:"死",wuXing:"土",dizhi:["未","申"],jiXiong:"凶"},
3:{name:"震",tianXian:[3],houTian:[4],origXing:"冲",origMen:"伤",wuXing:"木",dizhi:["卯"],jiXiong:"凶"},
4:{name:"巽",tianXian:[4],houTian:[3],origXing:"辅",origMen:"杜",wuXing:"木",dizhi:["辰","巳"],jiXiong:"平"},
5:{name:"中五",tianXian:[5],houTian:[5],origXing:"禽",origMen:"禽",wuXing:"土",dizhi:[],jiXiong:"平"},
6:{name:"乾",tianXian:[6],houTian:[1],origXing:"心",origMen:"开",wuXing:"金",dizhi:["戌","亥"],jiXiong:"吉"},
7:{name:"兑",tianXian:[7],houTian:[2],origXing:"柱",origMen:"惊",wuXing:"金",dizhi:["酉"],jiXiong:"凶"},
8:{name:"艮",tianXian:[8],houTian:[7],origXing:"任",origMen:"生",wuXing:"土",dizhi:["丑","寅"],jiXiong:"吉"},
9:{name:"离",tianXian:[9],houTian:[9],origXing:"英",origMen:"景",wuXing:"火",dizhi:["午"],jiXiong:"平"}
};
const DUI_CHONG={1:9,9:1,2:8,8:2,3:7,7:3,4:6,6:4};
const LIUHE_MAP={"子":"丑","丑":"子","寅":"亥","亥":"寅","卯":"戌","戌":"卯","辰":"酉","酉":"辰","巳":"申","申":"巳","午":"未","未":"午"};
const gridOrder=[4,9,2,3,5,7,8,1,6];
const liuYi=["戊","己","庚","辛","壬","癸","丁","丙","乙"];

const solarTerms=[
{name:"小寒",m:1,d:6},{name:"大寒",m:1,d:20},{name:"立春",m:2,d:4},{name:"雨水",m:2,d:19},
{name:"惊蛰",m:3,d:6},{name:"春分",m:3,d:21},{name:"清明",m:4,d:5},{name:"谷雨",m:4,d:20},
{name:"立夏",m:5,d:6},{name:"小满",m:5,d:21},{name:"芒种",m:6,d:6},{name:"夏至",m:6,d:21},
{name:"小暑",m:7,d:7},{name:"大暑",m:7,d:23},{name:"立秋",m:8,d:7},{name:"处暑",m:8,d:23},
{name:"白露",m:9,d:8},{name:"秋分",m:9,d:23},{name:"寒露",m:10,d:8},{name:"霜降",m:10,d:23},
{name:"立冬",m:11,d:7},{name:"小雪",m:11,d:22},{name:"大雪",m:12,d:7},{name:"冬至",m:12,d:22}
];
const dingJuTable={
"冬至":[1,4,7],"小寒":[2,5,8],"大寒":[3,6,9],"立春":[8,5,2],"雨水":[9,6,3],"惊蛰":[1,7,4],
"春分":[3,9,6],"清明":[4,1,7],"谷雨":[5,2,8],"立夏":[4,1,7],"小满":[5,2,8],"芒种":[6,3,9],
"夏至":[9,3,6],"小暑":[8,2,5],"大暑":[7,1,4],"立秋":[2,5,8],"处暑":[1,4,7],"白露":[9,3,6],
"秋分":[7,1,4],"寒露":[6,9,3],"霜降":[5,8,2],"立冬":[6,9,3],"小雪":[5,8,2],"大雪":[4,7,1]
};
const yangTerms=["冬至","小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种"];

// ========== 蓝球1-16五行归属（河洛数理：1/6水 2/7火 3/8木 4/9金 5/0土 循环）==========
const BLUE_WX={};
for(let n=1;n<=16;n++){
  const tail=n%10;
  if(tail===1||tail===6) BLUE_WX[n]="水";
  else if(tail===2||tail===7) BLUE_WX[n]="火";
  else if(tail===3||tail===8) BLUE_WX[n]="木";
  else if(tail===4||tail===9) BLUE_WX[n]="金";
  else BLUE_WX[n]="土";
}

// ========== 辅助函数 ==========
function getSolarTerm(d){const m=d.getMonth()+1,dd=d.getDate();let b=null,bd=999;for(let s of solarTerms){let df=Math.abs((m-s.m)*31+(dd-s.d));if(df<bd){bd=df;b=s;}}return b.name;}
function getSeasonWuxing(st){if(["立春","雨水","惊蛰","清明","谷雨"].includes(st))return"木";if(["立夏","小满","芒种","小暑","大暑"].includes(st))return"火";if(["立秋","处暑","白露","秋分","寒露"].includes(st))return"金";if(["立冬","小雪","大雪","冬至","小寒"].includes(st))return"水";return"土";}
function getFuTouYuan(gz){const gi=tianGan.indexOf(gz.dayGan),zi=diZhi.indexOf(gz.dayZhi);let db=0,g=gi;while(g!==0&&g!==5){g=(g-1+10)%10;db++;}let fz=(zi-db+12)%12;let f=diZhi[fz];if(["子","午","卯","酉"].includes(f))return 0;if(["寅","申","巳","亥"].includes(f))return 1;return 2;}
function getDayGanZhi(d){const base=new Date("2000-01-01");const diff=Math.floor((d-base)/(86400000));return{dayGan:tianGan[(diff+5)%10],dayZhi:diZhi[(diff+11)%12]};}
function getHourGan(dayGan,si){const di=tianGan.indexOf(dayGan);return tianGan[((di%5)*2+si)%10];}
function getXunKong(dz){for(let k in xunKongTable){const sz=k.slice(-1);const zi=diZhi.indexOf(sz);const zl=[];for(let i=0;i<10;i++)zl.push(diZhi[(zi+i)%12]);if(zl.includes(dz))return{xunName:k,kongZhi:xunKongTable[k]};}return{xunName:"",kongZhi:[]};}
function arrangeDiPan(ju,yd){const gs=[1,2,3,4,5,6,7,8,9];const pos={};let st=gs.indexOf(ju);for(let i=0;i<9;i++){let p=yd?gs[(st+i)%9]:gs[(st-i+9)%9];pos[p]=liuYi[i];}return pos;}
function getDunJuBySolarTerm(st,yuan){const jues=dingJuTable[st];const yd=yangTerms.includes(st);return{yangDun:yd,ju:jues[yuan]};}
function getLiuHePartnerGongs(dayZhi){
const partner=LIUHE_MAP[dayZhi];if(!partner)return[];
const gdm={1:["子"],2:["未","申"],3:["卯"],4:["辰","巳"],5:[],6:["戌","亥"],7:["酉"],8:["丑","寅"],9:["午"]};
let r=[];for(let g=1;g<=9;g++){if(gdm[g]&&gdm[g].includes(partner))r.push(g);}return r;
}

// ========== 确定性伪随机（日期做种子，同输入同结果）==========
function seededRandom(seedStr){
  let h=2166136261;
  const s=String(seedStr);
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return function(){
    h+=0x6D2B79F5;let t=h;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}

// ========== 排盘（拆补法+九星旋转）==========
function qiMenZhuanPan(dateStr,shiIdx){
const d=new Date(dateStr);
const gz=getDayGanZhi(d);
const hourGan=getHourGan(gz.dayGan,shiIdx);
const{xunName,kongZhi}=getXunKong(gz.dayZhi);
const solarTerm=getSolarTerm(d);
const yuan=getFuTouYuan(gz);
const{yangDun,ju}=getDunJuBySolarTerm(solarTerm,yuan);
const diPan=arrangeDiPan(ju,yangDun);
const fuYuanGong=Object.keys(diPan).find(k=>diPan[k]==="戊")*1;
const hourGanIdx=tianGan.indexOf(hourGan);

let sgGong;
if(yangDun)sgGong=((fuYuanGong-1)+hourGanIdx)%9+1;
else sgGong=((fuYuanGong-1)-hourGanIdx+9)%9+1;

const tianPan={};
for(let g=1;g<=9;g++){let off=(g-sgGong+9)%9;let src=((fuYuanGong-1)+off)%9+1;tianPan[g]=diPan[src];}
const zhiFuGong=sgGong;

const palaceSeq=[1,2,3,4,6,7,8,9];
const fuOrigIdx=palaceSeq.indexOf(fuYuanGong);
let zsIdx;if(yangDun)zsIdx=(fuOrigIdx+hourGanIdx)%8;else zsIdx=(fuOrigIdx-hourGanIdx+8)%8;
if(palaceSeq[zsIdx]===5)zsIdx=palaceSeq.indexOf(2);
const zhiShiGong=palaceSeq[zsIdx];

const xingSeq=["蓬","芮","冲","辅","禽","心","柱","任","英"];
const zfPosIdx=GONG_ORDER.indexOf(zhiFuGong);
const rotatedXing={};
for(let i=0;i<8;i++){
    let posIdx;
    if(yangDun) posIdx=(zfPosIdx+i)%8;
    else posIdx=(zfPosIdx-i+8)%8;
    rotatedXing[GONG_ORDER[posIdx]]=xingSeq[i];
}
rotatedXing[5]="禽";

const menBase=["休","死","伤","杜","开","惊","生","景"];
const zhiShiMen=palaceMeta[fuYuanGong].origMen;
const menStartIdx=menBase.indexOf(zhiShiMen);
const menArr={};
for(let i=0;i<8;i++){let pi=yangDun?(zsIdx+i)%8:(zsIdx-i+8)%8;let mi=(menStartIdx+i)%8;menArr[palaceSeq[pi]]=menBase[mi];}
menArr[5]=palaceMeta[5].origMen;

const shen={};
for(let i=0;i<8;i++){let g;if(yangDun)g=(zhiFuGong-1+i)%9+1;else g=(zhiFuGong-1-i+9)%9+1;if(g===5)continue;shen[g]=SHEN_LIST[i];}

const gongDizhiMap={1:["子"],2:["未","申"],3:["卯"],4:["辰","巳"],5:[],6:["戌","亥"],7:["酉"],8:["丑","寅"],9:["午"]};
let kongGongList=[],chongGongList=[];
kongZhi.forEach(z=>{for(let g=1;g<=9;g++){if(gongDizhiMap[g]&&gongDizhiMap[g].includes(z))kongGongList.push(g);}});
kongZhi.forEach(z=>{const cz=chongDizhi[z];for(let g=1;g<=9;g++){if(gongDizhiMap[g]&&gongDizhiMap[g].includes(cz))chongGongList.push(g);}});

const liuheGongs=getLiuHePartnerGongs(gz.dayZhi);

let palaceData={};
const seasonWX=getSeasonWuxing(solarTerm);
for(let g=1;g<=9;g++){
    let meta=palaceMeta[g];
    let rx=rotatedXing[g]||meta.origXing;
    let xwx=XING_WUXING[rx];
    let fuyin=(rx===meta.origXing);
    let wangxiang=false;
    if(xwx===seasonWX)wangxiang=true;
    if(wuxingSheng[seasonWX]===xwx)wangxiang=true;
    palaceData[g]={
        ...meta,
        xing:rx,
        xingWuxing:xwx,
        xingFull:XING_FULL[rx]||"天"+rx,
        diGan:diPan[g],
        tianGan:tianPan[g],
        men:menArr[g]||meta.origMen,
        shen:shen[g]||"",
        isZhiFu:g===zhiFuGong,
        isZhiShi:g===zhiShiGong,
        isChong:chongGongList.includes(g),
        isKong:kongGongList.includes(g),
        isLiuHe:liuheGongs.includes(g),
        isFuYin:fuyin,
        isWangXiang:wangxiang,
        score:0
    };
}
return{palaceData,gz,hourGan,zhiFuGong,zhiShiGong,ju,yangDun,xunName,solarTerm,yuan,kongGongList,chongGongList,baseWx:ganWuxing[gz.dayGan]};
}

// ========== 生子救母评分（红球用：星宫作用关系不变）==========
function calcShengZiScore(palaceData,gz,hourGan,zhiFuGong){
let baseWx=ganWuxing[gz.dayGan];

for(let g=1;g<=9;g++){
    const p=palaceData[g];
    let s=0;
    const gwx=p.wuXing;
    const xwx=p.xingWuxing;
    const rel=wuxingMap[baseWx];

    // 宫五行 vs 参考五行（生克关系）
    if(gwx===rel.shengWo)s+=W.shengWo;
    else if(gwx===rel.woSheng)s+=W.woSheng;
    else if(gwx===rel.keWo)s+=W.keWo;
    else if(gwx===rel.woKe)s+=W.woKe;
    else if(gwx===rel.tong)s+=W.biHe;

    // 九星作用关系（31字准则）
    if(wuxingSheng[xwx]===gwx)s+=W.xingShengGong;
    const xKe=wuxingKe[xwx];
    if(xKe && xKe===gwx) s+=W.xingKeGong;

    // 特殊条件
    if(p.isKong)s+=W.kongWang;
    if(p.isChong)s+=W.chong;
    if(p.isLiuHe)s+=W.liuHe;
    if(p.isFuYin)s+=W.fuYin;
    if(p.isWangXiang)s+=W.wangJia;

    p.score=s;
}
}

// ========== 前区号码自身条件优选（按和值/三区/奇偶加权）==========
function refineFrontPool(frontRaw, palaceData, selectedPalaces, baseWx){
  const cfg=GAME_CFG[currentGame];
  const recent30=ssqData.slice(0,30);
  const avgSum=recent30.length?Math.round(recent30.map(d=>d.nums.reduce((a,b)=>a+b,0)).reduce((a,b)=>a+b,0)/recent30.length):100;
  const avgSpan=recent30.length?Math.round(recent30.map(d=>Math.max(...d.nums)-Math.min(...d.nums)).reduce((a,b)=>a+b,0)/recent30.length):25;

  // 统计每个号码被哪些宫衍生出（跨宫次数）
  const numFreq={};
  frontRaw.forEach(n=>{numFreq[n]=(numFreq[n]||0)+1;});

  const weighted=frontRaw.map(n=>{
    // 基础权重：来源宫位的绝对价值分
    let w=0;
    for(const g of selectedPalaces){
      const p=palaceData[g];
      if(p && Math.abs(p.score)>w) w=Math.abs(p.score);
    }
    // 1) 单号对和值的贡献估算：越靠近均值结构越优
    const estSum=n*6;
    const sumFit=1-Math.min(1,Math.abs(estSum-avgSum)/avgSum);
    w+=sumFit*3;
    // 2) 三区均衡：中区(12-22)微加权，过低区(1-7)与过高区(28-33)微降权，防六数全挤一区
    if(n>=1&&n<=7) w*=0.88;
    else if(n>=12&&n<=22) w*=1.04;
    else if(n>=28&&n<=33) w*=0.9;
    // 3) 跨多宫推到的号码更可信
    w+=(numFreq[n]-1)*2;
    return {num:n,weight:w};
  });

  weighted.sort((a,b)=>b.weight-a.weight);
  // 取前16个，再升序（展示友好）
  return weighted.slice(0,16).map(x=>x.num).sort((a,b)=>a-b);
}

// ========== 红球号码收集（原逻辑完整保留：星宫关系、价值递推全部不变）==========
function collectNumbers(palaceData,useXianTian,kongGongList,cfg,baseWx){
const frontMax=cfg.frontMax,backMax=cfg.backMax;
let frontNums=new Set();
let selectedPalaces=Object.entries(palaceData)
  .sort((a,b)=>Math.abs(b[1].score)-Math.abs(a[1].score))
  .slice(0,7)
  .map(([g])=>Number(g));

const kongSet=new Set(kongGongList);
// 对冲宫强制纳入
for(let g=1;g<=9;g++){
    if(kongSet.has(g)){
        const dc=DUI_CHONG[g];
        if(dc){
            const dp=palaceData[dc];
            const baseNums=[...dp.houTian];
            if(useXianTian)baseNums.push(...dp.tianXian);

            baseNums.forEach(n=>{
                [n,n+10,n+20,n+30].forEach(num=>{
                    if(num>=1 && num<=frontMax){
                        frontNums.add(num);
                    }
                });
            });
        }
    }
}

// 所有宫：原递推规则不变
for(let g=1;g<=9;g++){
    const p=palaceData[g];
    const baseNums=[...p.houTian];
    if(useXianTian)baseNums.push(...p.tianXian);

    baseNums.forEach(n=>{
        [n,n+10,n+20,n+30].forEach(num=>{
            if(num>=1 && num<=frontMax){
                frontNums.add(num);
            }
        });
    });
}

// ===== 前区：生成规则不变，生成后按号码自身条件优选至16个 =====
const front=refineFrontPool(Array.from(frontNums),palaceData,selectedPalaces,baseWx);

// ===== 蓝球：改用五行生克打分筛选（保留对象结构，供渲染读取num/wx/score）=====
const blueScored=scoreBlueBalls(selectedPalaces,palaceData,baseWx);
const back=blueScored.slice(0,cfg.maxBack);

return{front,back};
}

// ========== 从指定宫位取数（红球取数规则不变，蓝球走生克）==========
function collectNumbersFromPalaces(palaceData,selectedPalaces,useXianTian,cfg,baseWx){
const frontMax=cfg.frontMax,backMax=cfg.backMax;
let frontNums=new Set();

// 红球：原逻辑保留（每个宫的本宫数 +10/+20/+30 递推）
for(const g of selectedPalaces){
    const p=palaceData[g];
    if(!p) continue;
    const baseNums=[...p.houTian];
    if(useXianTian)baseNums.push(...p.tianXian);

    baseNums.forEach(n=>{
        [n,n+10,n+20,n+30].forEach(num=>{
            if(num>=1 && num<=frontMax) frontNums.add(num);
        });
    });
}

// 前区：生成规则不变，生成后按号码自身条件优选至16个
const front=refineFrontPool(Array.from(frontNums),palaceData,selectedPalaces,baseWx);

// 蓝球：用生克打分
const blueScored=scoreBlueBalls(selectedPalaces,palaceData,baseWx);
const back=blueScored.slice(0,cfg.maxBack);

return{front,back};
}

// ========== 蓝球五行生克打分 ==========
function scoreBlueBalls(topPalaces,palaceData,baseWx){
  const cfg=GAME_CFG[currentGame];
  const backMax=cfg.backMax;
  const scored=[];

  // baseWx 缺失时退回"土"，避免整个函数抛错（防御）
  const rel=wuxingMap[baseWx]||wuxingMap["土"];

  // 推荐宫的宫五行 & 九星五行
  const palaceWxSet=[], starWxSet=[];
  topPalaces.forEach(g=>{
    const p=palaceData[g];
    if(p){ palaceWxSet.push(p.wuXing); starWxSet.push(p.xingWuxing); }
  });

  for(let n=1;n<=backMax;n++){
    const bwx=BLUE_WX[n];
    let s=0;

    // 1) 与日干五行关系（核心）
    if(bwx===rel.shengWo) s+=6;      // 生我（印）最高
    else if(bwx===rel.tong) s+=4;    // 比和
    else if(bwx===rel.woSheng) s+=2; // 我生
    else if(bwx===rel.woKe) s+=1;    // 我克（可控）
    else s-=3;                       // 克我（忌）

    // 2) 与推荐宫宫五行关系
    palaceWxSet.forEach(pwx=>{
      if(wuxingSheng[pwx]===bwx) s+=2;  // 宫生蓝球
      if(wuxingSheng[bwx]===pwx) s+=1;  // 蓝球生宫
      if(pwx===bwx) s+=1;               // 比和
      if(wuxingKe[pwx]===bwx) s-=1;     // 宫克蓝球
    });

    // 3) 与九星五行关系
    starWxSet.forEach(swx=>{
      if(wuxingSheng[swx]===bwx) s+=1;
      if(swx===bwx) s+=0.5;
    });

    scored.push({num:n,wx:bwx,score:s});
  }

  scored.sort((a,b)=>b.score-a.score);
  return scored;
}

// ========== 推荐5注号码（确定性算法：和值/旋转矩阵/三区/奇偶/重号邻号）==========
function generateRecommendations(palaceData,topPalaces,cfg,ssqData,dateSeed,baseWx){
const recDiv=document.getElementById("recommendations");
const useXT=document.getElementById("useXianTian").checked;

const pools=collectNumbersFromPalaces(palaceData,topPalaces,useXT,cfg,baseWx||palaceData[topPalaces[0]]&&palaceData[topPalaces[0]].wuXing);
const pool=pools.front;
const backCandidates=pools.back; // 生克排序后的蓝球候选（对象数组）

if(pool.length<6){
    recDiv.innerHTML=`<div style="color:#f87171;">号码池不足6个（仅${pool.length}个）：${pool.join(",")}，无法生成推荐。</div>`;
    return;
}

const recent=ssqData.slice(0,30);
const sums=recent.map(d=>d.nums.reduce((a,b)=>a+b,0));
const avgSum=Math.round(sums.reduce((a,b)=>a+b,0)/sums.length);
const avgSpan=Math.round(recent.map(d=>Math.max(...d.nums)-Math.min(...d.nums)).reduce((a,b)=>a+b,0)/recent.length);
const poolMaxSum=pool.slice(-6).reduce((a,b)=>a+b,0);
const adaptiveTarget=Math.round((avgSum+Math.min(avgSum,poolMaxSum))/2);

const rand=seededRandom(dateSeed||"default");

function calcSum(arr){return arr.reduce((a,b)=>a+b,0);}
function calcSpan(arr){return Math.max(...arr)-Math.min(...arr);}
function countOdd(arr){return arr.filter(n=>n%2===1).length;}
function zoneCount(arr,z){const ranges=[[1,11],[12,22],[23,33]];const[r0,r1]=ranges[z];return arr.filter(n=>n>=r0&&n<=r1).length;}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// 策略1：和值优化
function pickBySum(pool,target,n){
    let best=null,bestDiff=9999;
    for(let attempt=0;attempt<8000;attempt++){
        const sample=shuffle(pool).slice(0,n);
        const diff=Math.abs(calcSum(sample)-target);
        if(diff<bestDiff){bestDiff=diff;best=[...sample];if(diff<=5)break;}
    }
    return best.sort((a,b)=>a-b);
}

// 策略2：旋转矩阵（按间隔步进取数，避免池短时分连续前n个）
function wheelingPick(pool,n){
    if(pool.length<=n) return pool.slice(0,n).sort((a,b)=>a-b);
    const size=Math.min(pool.length,Math.max(n*2,10));
    const step=Math.max(1,Math.floor(pool.length/(n+2)));
    const base=[];
    for(let i=0;i<pool.length&&base.length<size;i+=step){base.push(pool[i]);}
    const sets=[];
    for(let i=0;i<Math.min(8,base.length);i++){
        const s=[...base];
        s.splice(i,1);
        if(s.length>=n) sets.push(s.slice(0,n).sort((a,b)=>a-b));
    }
    if(sets.length===0) return base.slice(0,n).sort((a,b)=>a-b);
    sets.sort((a,b)=>Math.abs(calcSum(a)-adaptiveTarget)-Math.abs(calcSum(b)-adaptiveTarget));
    return sets[0];
}

// 策略3：三区均衡（1-11/12-22/23-33 各2个）
function pickByZone(pool){
    const z1=pool.filter(n=>n>=1&&n<=11);
    const z2=pool.filter(n=>n>=12&&n<=22);
    const z3=pool.filter(n=>n>=23&&n<=33);
    const r=[];
    [z1,z2,z3].forEach(z=>{ r.push(...shuffle(z).slice(0,2)); });
    while(r.length<6){
        const remaining=pool.filter(n=>!r.includes(n));
        if(remaining.length===0)break;
        r.push(remaining[Math.floor(rand()*remaining.length)]);
    }
    return r.slice(0,6).sort((a,b)=>a-b);
}

// 策略4：奇偶平衡
function pickByOddEven(pool){
    const odds=pool.filter(n=>n%2===1);
    const evens=pool.filter(n=>n%2===0);
    const r=[];
    const oddTarget=rand()>0.5?3:4;
    const evenTarget=6-oddTarget;
    r.push(...shuffle(odds).slice(0,oddTarget));
    r.push(...shuffle(evens).slice(0,evenTarget));
    while(r.length<6){
        const remaining=pool.filter(n=>!r.includes(n));
        if(remaining.length===0)break;
        r.push(remaining[Math.floor(rand()*remaining.length)]);
    }
    return r.slice(0,6).sort((a,b)=>a-b);
}

// 策略5：重号邻号（结合上期开奖号）
function pickByRepeat(pool,prevNums){
    const r=[];
    const repeats=pool.filter(n=>prevNums.includes(n));
    if(repeats.length>0) r.push(...shuffle(repeats).slice(0,Math.min(2,repeats.length)));
    const neighbors=pool.filter(n=>prevNums.some(p=>Math.abs(n-p)===1)&&!r.includes(n));
    if(neighbors.length>0) r.push(...shuffle(neighbors).slice(0,Math.min(2,neighbors.length)));
    while(r.length<6){
        const remaining=pool.filter(n=>!r.includes(n));
        if(remaining.length===0)break;
        r.push(remaining[Math.floor(rand()*remaining.length)]);
    }
    return r.slice(0,6).sort((a,b)=>a-b);
}

const prevNums=ssqData[0]?ssqData[0].nums:[];

const set1=pickBySum(pool,adaptiveTarget,6);
const set2=wheelingPick(pool,6);
const set3=pickByZone(pool);
const set4=pickByOddEven(pool);
const set5=pickByRepeat(pool,prevNums);

const sets=[set1,set2,set3,set4,set5];
const strategies=[
    `和值优化(目标${adaptiveTarget})`,
    `旋转矩阵(步进间隔取数)`,
    `三区均衡(2+2+2)`,
    `奇偶平衡(${countOdd(set4)}奇${6-countOdd(set4)}偶)`,
    `重号邻号(上期${prevNums.join(",")})`
];

// 蓝球按生克候选确定性地取5个（不全相同）
const bluePick=[];
for(let i=0;i<5;i++){
  if(backCandidates.length>i) bluePick.push(backCandidates[i].num);
  else if(backCandidates.length>0) bluePick.push(backCandidates[i%backCandidates.length].num);
}

let html=`<strong>基于宫位[${topPalaces.join(",")}]的红球池(${pool.length}个)：</strong><br>`;
html+=`<div style="background:#1a1040;padding:8px;border-radius:6px;margin:6px 0;font-size:13px;">${pool.join(", ")}</div>`;
html+=`<div style="font-size:12px;color:#aaa;margin:4px 0;">历史30期平均和值：${avgSum} | 池最大和值：${poolMaxSum} | 自适应目标：${adaptiveTarget} | 平均跨度：${avgSpan}</div>`;
html+=`<div style="font-size:12px;color:#a78bfa;margin:4px 0;">蓝球候选（生克排序）：${backCandidates.slice(0,6).map(x=>x.num+"("+x.wx+":"+x.score.toFixed(1)+")").join("、")}</div>`;
html+=`<strong>推荐5注：</strong><br>`;
sets.forEach((set,i)=>{
    const sum=calcSum(set);
    const span=calcSpan(set);
    const odd=countOdd(set);
    const zones=[0,1,2].map(z=>zoneCount(set,z)).join("-");
    html+=`<div class="recSet">
        <strong>第${i+1}注（${strategies[i]}）：</strong><br>
        前区：${set.map(n=>String(n).padStart(2,"0")).join(" ")}<br>
        <span style="font-size:11px;color:#aaa;">和值:${sum} | 跨度:${span} | 奇偶:${odd}:${6-odd} | 区间:${zones}</span><br>
        后区：${String(bluePick[i]).padStart(2,"0")}
    </div>`;
});

recDiv.innerHTML=html;
}

            });
            if(item){
                const frontNums=item.lotteryDrawResult.split(" ").map(Number).sort((a,b)=>a-b);
                const backNums=item.lotteryDrawBackResult?item.lotteryDrawBackResult.split(" ").map(Number).sort((a,b)=>a-b):[];
                let numStr=frontNums.map(n=>String(n).padStart(2,"0")).join(" ");
                if(backNums.length)numStr+=" + "+backNums.map(n=>String(n).padStart(2,"0")).join(" ");
                document.getElementById("awardNum").value=numStr;
                statusEl.textContent="已获取 "+targetDate+" 开奖号";
                return true;
            }
        }
    } else {
        const proxies=[
            "https://corsproxy.io/?"+encodeURIComponent("https://www.cwl.gov.cn/cwl_admin/front/cwlkj/search/kjxx/findDrawNotice?name=ssq&issueCount=100"),
            "https://api.allorigins.win/raw?url="+encodeURIComponent("https://www.cwl.gov.cn/cwl_admin/front/cwlkj/search/kjxx/findDrawNotice?name=ssq&issueCount=100")
        ];
        for(let proxy of proxies){
            try{
                const ctrl=new AbortController();
                const timer=setTimeout(()=>ctrl.abort(),10000);
                const resp=await fetch(proxy,{signal:ctrl.signal});
                clearTimeout(timer);
                if(resp.ok){
                    const data=await resp.json();
                    if(data.result){
                        const item=data.result.find(x=>x.date===targetDate);
                        if(item){
                            const reds=item.red.split(",").map(Number).sort((a,b)=>a-b);
                            const blue=parseInt(item.blue);
                            document.getElementById("awardNum").value=reds.map(n=>String(n).padStart(2,"0")).join(" ")+" + "+String(blue).padStart(2,"0");
                            statusEl.textContent="已获取 "+targetDate+" 开奖号";
                            return true;
                        }
                    }
                }
            }catch(e){continue;}
        }
    }
    statusEl.textContent=targetDate+" 的开奖号未找到";
    document.getElementById("awardNum").value="";
    return false;
}catch(e){
    statusEl.textContent="联网失败："+e.message;
    return false;
}
}

// ========== 日期格式化 ==========
function fmtDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

// ========== 自动定位到下一个开奖日 ==========
function getNextDrawDate(){
const cfg=GAME_CFG[currentGame];
const today=new Date();today.setHours(0,0,0,0);
if(cfg.drawDays.includes(today.getDay())){
    return fmtDate(today);
}
let d=new Date(today);
for(let i=0;i<7;i++){
    d.setDate(d.getDate()+1);
    if(cfg.drawDays.includes(d.getDay())){
        return fmtDate(d);
    }
}
return fmtDate(today);
}

// ========== 回测核心 ==========
function runBacktest(){
const resultDom=document.getElementById("backTestResult");
resultDom.innerHTML='<div class="loading">170期回测运算中，请稍候...</div>';
setTimeout(function(){
const cfg=GAME_CFG[currentGame];
const useXT=document.getElementById("useXianTian").checked;
let results=[];
let lastPan=null;

for(let i=0;i<ssqData.length;i++){
    const rec=ssqData[i];
    const pan=qiMenZhuanPan(rec.date,rec.shi);
    calcShengZiScore(pan.palaceData,pan.gz,pan.hourGan,pan.zhiFuGong);

    const topPalaces=Object.entries(pan.palaceData)
        .sort((a,b)=>Math.abs(b[1].score)-Math.abs(a[1].score))
        .slice(0,7)
        .map(([g])=>Number(g));

    const pools=collectNumbers(pan.palaceData,useXT,pan.kongGongList,cfg,pan.baseWx);
    const frontSet=new Set(pools.front);
    let hits=0;
    const hitNums=[];
    const missNums=[];
    rec.nums.forEach(n=>{if(frontSet.has(n)){hits++;hitNums.push(n);}else{missNums.push(n);}});
    results.push({
        idx:i+1,
        date:rec.date,
        topPalaces:topPalaces,
        frontPool:pools.front,
        backPool:pools.back,
        frontSize:pools.front.length,
        backSize:pools.back.length,
        actual:rec.nums,
        blue:rec.blue,
        hits:hits,
        hitNums:hitNums,
        missNums:missNums,
        coverage:hits/6
    });
    lastPan=pan;
}

let totalHits=0,hitDist=[0,0,0,0,0,0,0],totalPoolSize=0;
results.forEach(r=>{
    totalHits+=r.hits;
    hitDist[r.hits]++;
    totalPoolSize+=r.frontSize;
});
const avgHit=(totalHits/ssqData.length).toFixed(2);
const avgCov=(totalHits/(ssqData.length*6)*100).toFixed(1);
const avgPool=(totalPoolSize/ssqData.length).toFixed(1);

const randExp=(16/33*6).toFixed(2);
const randCov=(16/33*100).toFixed(1);
const excessHit=(avgHit-randExp).toFixed(2);
const excessCov=(avgCov-randCov).toFixed(1);

let html=`<strong>===== ${ssqData.length}期回测结果（前区优选至16个版）=====</strong><br><br>
<strong>平均命中：</strong>${avgHit} / 6<br>
<strong>平均覆盖率：</strong>${avgCov}%<br>
<strong>平均前区池大小：</strong>${avgPool} 个（优选后固定≤16）<br><br>
<strong>命中分布：</strong><br>
中0：${hitDist[0]}期 | 中1：${hitDist[1]}期 | 中2：${hitDist[2]}期 | 中3：${hitDist[3]}期 | 中4：${hitDist[4]}期 | 中5：${hitDist[5]}期 | 中6：${hitDist[6]}期<br><br>
<strong>随机基准对比：</strong><br>
随机期望命中：${randExp} | 随机期望覆盖率：${randCov}%<br>
超额命中：${excessHit} | 超额覆盖率：${excessCov}%`;
resultDom.innerHTML=html;

if(lastPan){
    renderJiuGong(lastPan.palaceData,lastPan);
    analyzeBlueBall(ssqData);
    const topPalaces=renderScoreRanking(lastPan.palaceData);
    generateRecommendations(lastPan.palaceData,topPalaces,cfg,ssqData,ssqData[ssqData.length-1].date,lastPan.baseWx);
    const lastPool=results[results.length-1];
    document.getElementById("poolInfo").innerHTML=`<strong>第${lastPool.idx}期 (${lastPool.date})</strong><br>推荐选宫（前7）：${lastPool.topPalaces.join("、")}宫<br>前区池(${lastPool.frontSize}个)：${lastPool.frontPool.join(", ")}<br>蓝球候选(${lastPool.backSize}个)：${lastPool.backPool.slice(0,6).map(x=>x.num+"("+x.wx+")").join(",")}<br>开奖号：${lastPool.actual.join(" ")}+${lastPool.blue}<br>前区命中：<span class="hit">${lastPool.hits}个</span> [${lastPool.hitNums.join(",")||"无"}] 遗漏：<span class="miss">[${lastPool.missNums.join(",")||"无"}]</span>`;
}
},100);
}

// ========== 单期推演 ==========
async function runSingle(){
const dateStr=document.getElementById("calcDate").value;
const shiIdx=Number(document.getElementById("calcShiChen").value);
const awardStr=document.getElementById("awardNum").value.trim();
const useXT=document.getElementById("useXianTian").checked;
if(!dateStr){alert("请选择日期");return;}

const cfg=GAME_CFG[currentGame];

if(!awardStr){
    await fetchDrawByDate(dateStr);
}

const pan=qiMenZhuanPan(dateStr,shiIdx);
calcShengZiScore(pan.palaceData,pan.gz,pan.hourGan,pan.zhiFuGong);
renderJiuGong(pan.palaceData,pan);

// 排序显示（返回前7宫用于推荐）
const topPalaces=renderScoreRanking(pan.palaceData);

// 篮球分析
analyzeBlueBall(ssqData);

// 推荐5注（用前7宫 + 日期种子 + 日干五行）
generateRecommendations(pan.palaceData,topPalaces,cfg,ssqData,dateStr,pan.baseWx);

// 从前7宫取数
const pools=collectNumbers(pan.palaceData,useXT,pan.kongGongList,cfg,pan.baseWx);

let poolHtml=`<strong>推荐宫位：</strong>${topPalaces.join("、")}宫<br>`;
poolHtml+=`<strong>前区池(${pools.front.length}个)：</strong>${pools.front.join(", ")}（优选后≤16）<br>`;
poolHtml+=`<strong>蓝球候选(${pools.back.length}个)：</strong>${pools.back.slice(0,6).map(x=>x.num+"("+x.wx+":"+x.score.toFixed(1)+")").join(",")}`;
document.getElementById("poolInfo").innerHTML=poolHtml;

const sr=document.getElementById("singleResult");
sr.style.display="block";

// 各宫得分
let scoreHtml="<strong>各宫得分：</strong><br>";
for(let g=1;g<=9;g++){
    const p=pan.palaceData[g];
    scoreHtml+=`${g}宫(${p.name}) ${p.xingFull} ${p.men} ${p.shen||"-"} → <strong>${p.score}</strong> `;
    let tags=[];
    if(p.isKong)tags.push("空亡");if(p.isChong)tags.push("冲");if(p.isLiuHe)tags.push("六合");
    if(p.isFuYin)tags.push("伏吟");if(p.isWangXiang)tags.push("旺相");
    if(tags.length)scoreHtml+="["+tags.join(",")+"]";
    scoreHtml+="<br>";
}

// 复盘对比
let reviewHtml="";
const finalAwardStr=document.getElementById("awardNum").value.trim();
if(finalAwardStr){
    const sp=finalAwardStr.replace("+"," ").split(/\s+/).map(Number).filter(n=>!isNaN(n));
    const reds=sp.slice(0,cfg.frontPick);
    const frontSet=new Set(pools.front);
    let hits=0,hitNums=[],missNums=[];
    reds.forEach(n=>{if(frontSet.has(n)){hits++;hitNums.push(n);}else{missNums.push(n);}});
    reviewHtml=`<br><br><strong>复盘：</strong>开奖 ${reds.join(" ")}<br>前区命中 <span class="hit">${hits}/${cfg.frontPick}</span> [${hitNums.join(",")||"无"}] 遗漏 <span class="miss">[${missNums.join(",")||"无"}]</span>`;
}

sr.innerHTML=scoreHtml+reviewHtml;
}

// ========== 历史对比分析 ==========
function runCompare(){
const dateStr=document.getElementById("compareDate").value;
if(!dateStr){alert("请选择日期");return;}

const rec=ssqData.find(d=>d.date===dateStr);
if(!rec){
    document.getElementById("compareResult").style.display="block";
    document.getElementById("compareResult").innerHTML=`<span class="miss">未找到 ${dateStr} 的开奖数据</span>`;
    return;
}

const cfg=GAME_CFG[currentGame];
const useXT=document.getElementById("useXianTian").checked;
const pan=qiMenZhuanPan(dateStr,rec.shi||11);
calcShengZiScore(pan.palaceData,pan.gz,pan.hourGan,pan.zhiFuGong);

// 按绝对值排序
const sorted=Object.entries(pan.palaceData)
    .map(([g,p])=>({palace:parseInt(g),...p}))
    .sort((a,b)=>Math.abs(b.score)-Math.abs(a.score));

// 前7宫取数
const top7=sorted.slice(0,7).map(p=>p.palace);
const pools=collectNumbers(pan.palaceData,useXT,pan.kongGongList,cfg,pan.baseWx);
const poolSet=new Set(pools.front);

// 对比
const hits=rec.nums.filter(n=>poolSet.has(n));
const misses=rec.nums.filter(n=>!poolSet.has(n));

// 各宫得分明细
let scoreDetail="";
sorted.forEach((p,i)=>{
    const inTop7=i<7;
    const tags=[];
    if(p.isFuYin)tags.push("伏吟");if(p.isWangXiang)tags.push("旺相");
    if(p.isKong)tags.push("空亡");if(p.isChong)tags.push("冲");
    scoreDetail+=`<tr style="${inTop7?'background:#1e40af33':''}">
        <td>${i+1}</td><td>${p.palace}宫</td><td>${p.xingFull}</td>
        <td>${p.score}</td><td>${Math.abs(p.score)}</td>
        <td>${tags.join(",")||"-"}</td>
        <td>${inTop7?'✓':'-'}</td>
    </tr>`;
});

// 号码池与开奖号对比
let poolCompare="";
const allNums=Array.from({length:cfg.frontMax},(_,i)=>i+1);
allNums.forEach(n=>{
    const inPool=poolSet.has(n);
    const isHit=rec.nums.includes(n);
    let cls="";
    if(inPool&&isHit)cls="hit";
    else if(!inPool&&isHit)cls="miss";
    if(inPool||isHit){
        poolCompare+=`<span class="${cls}" style="display:inline-block;padding:2px 6px;margin:2px;border-radius:4px;background:${inPool?(isHit?'#14532d':'#1e293b'):(isHit?'#7f1d1d':'transparent')};">${String(n).padStart(2,"0")}${isHit?'★':''}</span>`;
    }
});

const resultDiv=document.getElementById("compareResult");
resultDiv.style.display="block";
resultDiv.innerHTML=`
<strong>===== ${dateStr} 对比分析 =====</strong><br><br>
<strong>开奖号：</strong>${rec.nums.map(n=>String(n).padStart(2,"0")).join(" ")} + ${rec.blue}<br>
<strong>推荐宫位（前7）：</strong>${top7.join("、")}宫<br>
<strong>号码池：</strong>${pools.front.length}个（优选后≤16）<br><br>
<strong>命中：</strong><span class="hit">${hits.length}/6</span> [${hits.map(n=>String(n).padStart(2,"0")).join(" ")}]<br>
<strong>遗漏：</strong><span class="miss">${misses.map(n=>String(n).padStart(2,"0")).join(" ")}</span><br>
<strong>覆盖率：</strong>${(hits.length/6*100).toFixed(0)}%<br><br>
<strong>号码池与开奖号对比</strong>（★=开奖号，绿=命中，红=遗漏）：<br>
<div style="margin:6px 0;line-height:2;">${poolCompare}</div><br>
<strong>九宫评分排序：</strong>
<table><tr><th>排名</th><th>宫位</th><th>星</th><th>得分</th><th>绝对值</th><th>标签</th><th>入选</th></tr>
${scoreDetail}</table>`;
}

document.getElementById("runSingleBtn").onclick=runSingle;
document.getElementById("runBatchBtn").onclick=runBacktest;
document.getElementById("runCompareBtn").onclick=runCompare;

document.querySelectorAll(".game-tab").forEach(tab=>{
    tab.onclick=function(){
        document.querySelectorAll(".game-tab").forEach(t=>t.classList.remove("active"));
        this.classList.add("active");
        currentGame=this.dataset.game;
        document.getElementById("calcDate").value=getNextDrawDate();
        document.getElementById("fetchStatus").textContent="";
        document.getElementById("awardNum").value="";
        document.getElementById("singleResult").style.display="none";
    };
});

document.getElementById("calcDate").addEventListener("change",async function(){
    const dateStr=this.value;if(!dateStr)return;
    document.getElementById("singleResult").style.display="none";
    document.getElementById("awardNum").value="";
    const today=new Date();today.setHours(0,0,0,0);
    const selected=new Date(dateStr);selected.setHours(0,0,0,0);
    if(selected>today){document.getElementById("fetchStatus").textContent="该日期尚未开奖";return;}
    await fetchDrawByDate(dateStr);
});

document.getElementById("calcDate").value=getNextDrawDate();
window.onload=function(){runBacktest();};
</script>
