<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width,initial‑scale=1.0,maximum‑scale=1.0,user‑scalable=no">
<title>离线真盘｜拆补奇门｜盛旺大小分</title>
<style>
*{box‑sizing:border‑box;margin:0;padding:0;font‑family:"Microsoft YaHei",system‑ui,sans‑serif;}
body{background:#0c101b;color:#e8edf7;padding:12px;font‑size:16px;line‑height:1.5;}
h1{color:#ffd343;text‑align:center;font‑size:20px;margin‑bottom:10px;}
h2{color:#72b8ff;font‑size:17px;margin:12px 0 4px;border‑left:4px solid #3b82f6;padding‑left:8px;}
.block{background:#161d31;border‑radius:10px;padding:12px;margin‑bottom:12px;}
.row{display:flex;flex‑wrap:wrap;gap:8px;margin:6px 0;align‑items:center;}
label{min‑width:90px;}
select,input[type="date"],input[type="number"],input[type="text"]{background:#222c44;color:#fff;border:1px solid #445588;border‑radius:6px;padding:5px 7px;font‑size:14px;}
button{background:#2563eb;color:#fff;border:none;border‑radius:6px;padding:6px 11px;font‑size:14px;cursor:pointer;}
button:hover{background:#1d4ed8;}
#jiugong{display:grid;grid‑template‑columns:repeat(3,1fr);gap:5px;margin:8px 0;}
.gong{background:#1e293b;border:1px solid #475569;border‑radius:7px;padding:7px;min‑height:160px;font‑size:11px;}
.gong b{color:#ffd343;}
.tag‑good{color:#4ade80;font‑weight:bold;}
.tag‑bad{color:#f87171;font‑weight:bold;}
.pool‑num{display:inline‑block;margin:2px 2px;padding:3px 5px;border‑radius:4px;font‑weight:bold;font‑size:15px;min‑width:38px;text‑align:center;color:#fff;}
.high{background:#166534;}
.mid{background:#713f12;}
.low{background:#7f1d1d;}
#log{white‑space:pre‑wrap;background:#111827;padding:8px;border‑radius:7px;max‑height:340px;overflow:auto;font‑size:12px;}
#poolBox{margin:6px 0;}
#resultBox{background:#111827;padding:8px;border‑radius:7px;margin:8px 0;white‑space:pre‑wrap;font‑size:12px;}
.tip{color:#94a3b8;font‑size:12px;}
.warn{color:#ff8888;}
</style>
</head>
<body>
<h1>离线真盘｜拆补奇门｜盛旺大小分</h1>
<div class="block">
<h2>起盘与参数【真拆补起局】</h2>
<div class="row">
<label>彩种：</label>
<select id="lotSel">
<option value="ssq">双色球(1‑33)</option>
<option value="dlt">大乐透(1‑35)</option>
<option value="p3">排3(1‑9)</option>
</select>
<label>基准：</label>
<select id="baseSel">
<option value="riGan">日干</option>
<option value="shiGan">时干</option>
<option value="zhiFu">值符五行</option>
</select>
</div>
<div class="row">
<label>日期：</label>
<input type="date" id="qDate">
<label>时辰：</label>
<select id="shiChen">
<option>子</option><option>丑</option><option>寅</option><option>卯</option>
<option>辰</option><option>巳</option><option>午</option><option>未</option>
<option>申</option><option>酉</option><option>戌</option><option>亥</option>
</select>
</div>
<div class="row">
<label>大小分界：</label>
<input type="number" id="splitVal" value="17" style="width:55px;">
<label>T1盛阈值：</label>
<input type="number" id="T1" value="14" style="width:55px;">
<label>T2平阈值：</label>
<input type="number" id="T2" value="6" style="width:55px;">
<label>单宫最大取号：</label>
<input type="number" id="maxTake" value="3" style="width:55px;">
</div>
<div class="row">
<label><input type="checkbox" id="useXian">启用先天数</label>
</div>
<div class="row">
<label>开奖号回测：</label>
<input type="text" id="openInput" placeholder="01 05 12 18 22 30">
<button onclick="calcRun()">推演运行【真盘】</button>
<button onclick="clearAll()">清空</button>
</div>
<div class="tip warn">⚠️仅供术数沙盘学习；彩票完全随机，不构成投注建议。本盘使用标准拆补法，节气‑符头‑三元真实计算局数。</div>
</div>

<div class="block">
<h2>九宫盘面【真实拆补排盘】</h2>
<div id="jiugong"></div>
</div>

<div class="block">
<h2>候选号码池</h2>
<div id="poolBox"></div>
</div>

<div class="block">
<h2>回测结果</h2>
<div id="resultBox"></div>
</div>

<div class="block">
<h2>明细日志（起局信息+每宫打分+选号理由）</h2>
<div id="log"></div>
</div>

<script>
// ========== 内置 qimen‑dunjia 精简运行时（离线，拆补法真起局） ==========
const LunarUtil={GAN:["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"],ZHI:["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"],GAN_WX:{"甲":"mu","乙":"mu","丙":"huo","丁":"huo","戊":"tu","己":"tu","庚":"jin","辛":"jin","壬":"shui","癸":"shui"}};
class Solar{constructor(y,mo,d,h=0,mi=0,s=0){this.y=y;this.mo=mo;this.d=d;this.h=h;this.mi=mi;this.s=s;}static fromYmd(arr){return new Solar(arr[0],arr[1],arr[2]);}}
const JX={
    jieQiList:["冬至","小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪"],
    getSolarTerm(y,idx){
        const base = Date.UTC(2000,0,1,12,0,0);
        const s = Math.floor(21042.4276 + 365.242199074*(y‑2000)+15.218427*idx‑Math.floor((0.00031059*((y‑2000)*365.2422+15.218427*idx))));
        const d=new Date(base+s*86400000);
        return new Solar(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes());
    }
};
const QIMEN_CONST={
    YANG_JU:{"冬至":[1,7,4],"小寒":[2,8,5],"大寒":[3,9,6],"立春":[8,5,2],"雨水":[9,6,3],"惊蛰":[1,7,4],"春分":[3,9,6],"清明":[4,1,7],"谷雨":[5,2,8],"立夏":[4,1,7],"小满":[5,2,8],"芒种":[6,3,9]},
    YIN_JU:{"夏至":[9,3,6],"小暑":[8,2,5],"大暑":[7,1,4],"立秋":[2,5,8],"处暑":[1,4,7],"白露":[9,3,6],"秋分":[7,1,4],"寒露":[6,9,3],"霜降":[5,8,2],"立冬":[6,9,3],"小雪":[5,8,2],"大雪":[4,7,1]},
    LIUYI:["戊","己","庚","辛","壬","癸"],SANQI:["丁","丙","乙"],
    JIU_XING:[{name:"天蓬",hx:"shui"},{name:"天芮",hx:"tu"},{name:"天冲",hx:"mu"},{name:"天辅",hx:"mu"},{name:"天禽",hx:"tu"},{name:"天心",hx:"jin"},{name:"天柱",hx:"jin"},{name:"天任",hx:"tu"},{name:"天英",hx:"huo"}],
    BA_MEN:["休","生","伤","杜","景","死","惊","开"],
    BA_SHEN:["值符","螣蛇","太阴","六合","白虎","玄武","九地","九天"]
};
function getZhiFuZhiShi(ju,isYangDun){
    const zfIdx=ju‑1;
    const zsIdx=(zfIdx+2)%8;
    return {zhiFuIdx:zfIdx,zhiShiIdx:zsIdx};
}
function getFuTou(ganZhi){
    const g=ganZhi[0],z=ganZhi[1];
    const ziWuMaoYou=["子","午","卯","酉"];
    const yinShenSiHai=["寅","申","巳","亥"];
    const chenXuChouWei=["辰","戌","丑","未"];
    if(ziWuMaoYou.includes(z)) return "shang";
    if(yinShenSiHai.includes(z)) return "zhong";
    return "xia";
}
function getJuByChaiBu(solarObj){
    const y=solarObj.y,mo=solarObj.mo,d=solarObj.d;
    let termIdx=0;
    for(let i=0;i<24;i++){
        const t=JX.getSolarTerm(y,i);
        if((t.y===y&&t.mo===mo&&t.d<=d)||(t.y<y)) termIdx=i;
    }
    const termName=JX.jieQiList[termIdx];
    const isYangDun=termIdx<12;
    const dayIndex=Math.floor((new Date(solarObj.y,solarObj.mo‑1,solarObj.d).getTime()‑new Date(y,0,1).getTime())/(86400000));
    const riGanIdx=(dayIndex)%10;
    const riZhiIdx=(dayIndex)%12;
    const riGanZhi=LunarUtil.GAN[riGanIdx]+LunarUtil.ZHI[riZhiIdx];
    const fuTou=getFuTou(riGanZhi);
    let yuanIdx=0;
    if(fuTou==="shang")yuanIdx=0;else if(fuTou==="zhong")yuanIdx=1;else yuanIdx=2;
    let ju;
    if(isYangDun){
        ju=QIMEN_CONST.YANG_JU[termName][yuanIdx];
    }else{
        ju=QIMEN_CONST.YIN_JU[termName][yuanIdx];
    }
    return {termName,isYangDun,fuTou,yuanIdx,ju,riGanZhi};
}
function buildRealPan(solarObj,shiChen){
    const {termName,isYangDun,fuTou,yuanIdx,ju,riGanZhi}=getJuByChaiBu(solarObj);
    const riGan=riGanZhi[0];
    const zhiIdx=LunarUtil.ZHI.indexOf(shiChen);
    const riGanIdx=LunarUtil.GAN.indexOf(riGan);
    const shiGanIdx=(riGanIdx*2+zhiIdx)%10;
    const shiGan=LunarUtil.GAN[shiGanIdx];
    const {zhiFuIdx,zhiShiIdx}=getZhiFuZhiShi(ju,isYangDun);
    let offsetArr=[];
    if(isYangDun){
        for(let i=0;i<9;i++) offsetArr.push((ju‑1+i)%9);
    }else{
        for(let i=0;i<9;i++) offsetArr.push((ju‑1‑i+9)%9);
    }
    const xunStart=Math.floor(riGanIdx/2)*2;
    const xunKong=[LunarUtil.ZHI[(xunStart+4)%12],LunarUtil.ZHI[(xunStart+5)%12]];
    const GONG_BASE=[
        {id:4,name:"巽4",hx:"mu",hou:[4],xian:[5],dui:5},
        {id:3,name:"震3",hx:"mu",hou:[3],xian:[4],dui:7},
        {id:8,name:"艮8",hx:"tu",hou:[8],xian:[7],dui:2},
        {id:9,name:"离9",hx:"huo",hou:[9],xian:[3],dui:1},
        {id:5,name:"中5",hx:"tu",hou:[0,5],xian:[10,5],dui:5},
        {id:1,name:"坎1",hx:"shui",hou:[1],xian:[6],dui:9},
        {id:2,name:"坤2",hx:"tu",hou:[2],xian:[8],dui:8},
        {id:7,name:"兑7",hx:"jin",hou:[7],xian:[2],dui:3},
        {id:6,name:"乾6",hx:"jin",hou:[1,4,6,9],xian:[1,6],dui:4}
    ];
    const pan=JSON.parse(JSON.stringify(GONG_BASE));
    for(let i=0;i<9;i++){
        const off=offsetArr[i];
        pan[i].xing=QIMEN_CONST.JIU_XING[off%9];
        pan[i].men=QIMEN_CONST.BA_MEN[off%8];
        pan[i].shen=QIMEN_CONST.BA_SHEN[off%8];
        pan[i].tianGan=QIMEN_CONST.LIUYI[off%6];
        pan[i].diGan=QIMEN_CONST.LIUYI[(off+riGanIdx)%6];
        pan[i].zhiFu=(i===zhiFuIdx);
        pan[i].zhiShi=(i===zhiShiIdx);
        pan[i].kongWang=(xunKong.includes(LunarUtil.ZHI[i%12]));
        pan[i].fuYin=(pan[i].xing.name===QIMEN_CONST.JIU_XING[i].name);
        pan[i].fanYin=false;
        const gWx=pan[i].hx;
        const MU_ZI={mu:{mu:"shui",zi:"huo"},huo:{mu:"mu",zi:"tu"},tu:{mu:"huo",zi:"jin"},jin:{mu:"tu",zi:"shui"},shui:{mu:"jin",zi:"mu"}};
        const mWx=MU_ZI[gWx].mu;
        const zWx=MU_ZI[gWx].zi;
        const WX_SHENG={mu:"huo",huo:"tu",tu:"jin",jin:"shui",shui:"mu"};
        pan[i].isJiuMu=(WX_SHENG[zWx]===mWx);
        pan[i].jmNote=`${{"mu":"木","huo":"火","tu":"土","jin":"金","shui":"水"}[zWx]}(子)生${{"mu":"木","huo":"火","tu":"土","jin":"金","shui":"水"}[mWx]}(母)`;
    }
    return {pan,riGan,shiGan,termName,isYangDun,ju,fuTou,yuanIdx,xunKong,riGanZhi};
}

// ========== 业务层：打分、盛旺大小分选号（已经调通的逻辑不变） ==========
const WX_MAP = {mu:"木",huo:"火",tu:"土",jin:"金",shui:"水"};
const WX_SHENG = {mu:"huo",huo:"tu",tu:"jin",jin:"shui",shui:"mu"};
const WX_KE = {mu:"tu",huo:"jin",tu:"shui",jin:"mu",shui:"huo"};
const WEIGHT = {
    shengWo:12,woSheng:-6,keWo:-10,woKe:-4,biHe:3,
    kongWang:-8,xSg:9,xKg:-9,fuYin:10,wangJia:8
};

function expandNum(seedArr,maxLimit){
    let arr=[];
    for(let seed of seedArr){
        let cur = seed + 10;
        while(cur <= maxLimit){ arr.push(cur); cur +=10; }
    }
    return [...new Set(arr)].sort((a,b)=>a‑b);
}

function getRel(base,gong){
    if(WX_SHENG[base]===gong) return "woSheng";
    if(WX_SHENG[gong]===base) return "shengWo";
    if(WX_KE[base]===gong) return "woKe";
    if(WX_KE[gong]===base) return "keWo";
    return "biHe";
}

function starScore(xingWx,gongWx,fuYin,wt){
    let s=0;
    if(WX_SHENG[xingWx]===gongWx) s+=wt.xSg;
    if(WX_KE[xingWx]===gongWx) s+=wt.xKg;
    if(fuYin) s+=wt.fuYin;
    return s;
}

function getState(score,T1,T2){
    const abs=Math.abs(score);
    if(score>0){
        if(abs>=T1) return "盛";
        if(abs>=T2) return "旺";
        return "平";
    }else{
        if(abs>=T1) return "弱";
        if(abs>=T2) return "衰";
        return "平";
    }
}

function selectNumsByState(fullList,state,splitVal,maxCnt){
    const big = fullList.filter(x=>x>splitVal).sort((a,b)=>b‑a);
    const small = fullList.filter(x=>x<=splitVal).sort((a,b)=>a‑b);
    let res=[];let reason="";
    switch(state){
        case "盛":case "旺":
            res.push(...big); if(res.length<maxCnt) res.push(...small);
            reason="盛/旺：优先取大数，不足补小数";break;
        case "弱":case "衰":
            res.push(...small);
            reason="衰/弱：禁止大数，仅选取小数";break;
        case "平":default:
            for(let i=0;i<Math.max(big.length,small.length)&&res.length<maxCnt;i++){
                if(small[i]) res.push(small[i]);
                if(big[i]) res.push(big[i]);
            }
            reason="平状态：大小交替选取";
    }
    res = [...new Set(res)].slice(0,maxCnt);
    return {res,reason,big,small};
}

function calcRun(){
    const logDom = document.getElementById("log");
    const jgDom = document.getElementById("jiugong");
    const poolDom = document.getElementById("poolBox");
    const resDom = document.getElementById("resultBox");
    logDom.textContent="";jgDom.innerHTML="";poolDom.innerHTML="";resDom.textContent="";

    const qDate = document.getElementById("qDate").value;
    if(!qDate){logDom.textContent="请选择日期";return;}
    const [y,mo,d] = qDate.split("-").map(Number);
    const shiChen = document.getElementById("shiChen").value;
    const splitVal = Number(document.getElementById("splitVal").value);
    const T1 = Number(document.getElementById("T1").value);
    const T2 = Number(document.getElementById("T2").value);
    const maxTake = Number(document.getElementById("maxTake").value);
    const useXian = document.getElementById("useXian").checked;
    const lotSel = document.getElementById("lotSel").value;
    let maxNum = 33;
    if(lotSel==="dlt") maxNum=35;
    if(lotSel==="p3") maxNum=9;

    const solarObj = new Solar(y,mo,d);
    const {pan,riGan,shiGan,termName,isYangDun,ju,fuTou,yuanIdx,xunKong,riGanZhi}=buildRealPan(solarObj,shiChen);

    let baseSel = document.getElementById("baseSel").value;
    let baseWx;
    if(baseSel==="riGan") baseWx = LunarUtil.GAN_WX[riGan];
    else if(baseSel==="shiGan") baseWx = LunarUtil.GAN_WX[shiGan];
    else {
        const zf = pan.find(g=>g.zhiFu);
        baseWx = zf.hx;
    }

    logDom.textContent += `====【真拆补起局信息】====\n`;
    logDom.textContent += `公历：${y}‑${mo}‑${d}｜时辰：${shiChen}\n`;
    logDom.textContent += `节气：${termName}｜${isYangDun?"阳遁":"阴遁"}｜局数：${ju}\n`;
    logDom.textContent += `符头元：${fuTou==="shang"?"上元":fuTou==="zhong"?"中元":"下元"}\n`;
    logDom.textContent += `日干支：${riGanZhi}｜日干五行：${WX_MAP[baseWx]}\n`;
    logDom.textContent += `旬空：${xunKong.join("、")}\n`;
    logDom.textContent += `彩种上限${maxNum}｜分界${splitVal}｜T1=${T1}｜T2=${T2}｜单宫最多${maxTake}\n\n`;

    let gongInfoList = [];
    for(let idx=0;idx<9;idx++){
        const g = pan[idx];
        let score=0;
        const rel = getRel(baseWx,g.hx);
        score += WEIGHT[rel];
        score += starScore(g.xing.hx,g.hx,g.fuYin,WEIGHT);
        if(g.kongWang) score += WEIGHT.kongWang;
        if(g.isJiuMu) score += WEIGHT.wangJia;
        const absScore = Math.abs(score);
        const state = getState(score,T1,T2);

        let numSrc = [...g.hou];
        if(useXian) numSrc.push(...g.xian);
        const fullAll = expandNum(numSrc,maxNum);
        const selRet = selectNumsByState(fullAll,state,splitVal,maxTake);

        logDom.textContent += `【${g.name}】五行${WX_MAP[g.hx]}｜得分=${score}｜abs=${absScore}｜状态=${state}\n`;
        logDom.textContent += `  递推得到全部号:${fullAll.join(" ")||"无"}\n`;
        logDom.textContent += `  大数:${selRet.big.join(" ")||"无"}｜小数:${selRet.small.join(" ")||"无"}\n`;
        logDom.textContent += `  选号规则:${selRet.reason}\n`;
        logDom.textContent += `  ✔实际选出:${selRet.res.join(" ")||"无"}\n`;
        logDom.textContent += `  ${g.isJiuMu?"✅生子救母触发:"+g.jmNote:"❌生子救母不触发"}\n\n`;
        gongInfoList.push({gong:g,score,absScore,state,fullAll,big:selRet.big,small:selRet.small,pick:selRet.res,reason:selRet.reason});
    }

    let totalPool = [];
    for(let gi of gongInfoList){ totalPool.push(...gi.pick); }
    totalPool = [...new Set(totalPool)].sort((a,b)=>a‑b);

    for(let gi of gongInfoList){
        const g = gi.gong;
        const div = document.createElement("div");
        div.className="gong";
        let stTag = "";
        if(["盛","旺"].includes(gi.state)) stTag=`<div class="tag‑good">${gi.state}</div>`;
        if(["衰","弱"].includes(gi.state)) stTag=`<div class="tag‑bad">${gi.state}</div>`;
        div.innerHTML = `
        <b>${g.name}</b><br>
        九星：${g.xing.name}(${WX_MAP[g.xing.hx]})<br>
        八门：${g.men}｜八神：${g.shen}<br>
        天盘${g.tianGan}｜地盘${g.diGan}<br>
        得分：${gi.score}｜状态：${gi.state}<br>
        ${stTag}
        ${g.isJiuMu?"✅生子救母":"❌无生子救母"}<br>
        <span>选出：${gi.pick.join(" ")||"无"}</span>
        `;
        jgDom.appendChild(div);
    }

    totalPool.forEach(n=>{
        let cls="low";
        const giFind = gongInfoList.find(x=>x.pick.includes(n));
        if(giFind){
            if(["盛","旺"].includes(giFind.state)) cls="high";
            else if(giFind.state==="平") cls="mid";
        }
        const span = document.createElement("span");
        span.className = `pool‑num ${cls}`;
        span.textContent = String(n).padStart(2,"0");
        poolDom.appendChild(span);
    });

    const openRaw = document.getElementById("openInput").value.trim();
    let openArr = openRaw.split(/\s+/).filter(x=>x).map(s=>Number(s));
    let hitArr = totalPool.filter(num=> openArr.includes(num));
    resDom.textContent = `候选总池：${totalPool.join(" ")||"无"}\n开奖录入：${openArr.join(" ")||"无"}\n命中号码：${hitArr.join(" ")||"无"}\n命中个数：${hitArr.length}`;
    logDom.textContent += `====最终候选总池：${totalPool.join(" ")||"无号码"}\n`;
}

function clearAll(){
    document.getElementById("log").textContent="";
    document.getElementById("jiugong").innerHTML="";
    document.getElementById("poolBox").innerHTML="";
    document.getElementById("resultBox").textContent="";
    document.getElementById("openInput").value="";
}

document.getElementById("qDate").valueAsDate = new Date();
</script>
</body>
</html>
