<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>奇门遁甲·真盘精准版·宫数合一取号系统</title>
<style>
:root{
  --bg:#0a0e17;--panel:#121a2b;--panel2:#0e1524;--line:#243353;
  --gold:#ffd24a;--cyan:#6fe3ff;--red:#ff6b6b;--green:#5be39a;--purple:#b794ff;
  --txt:#e6ecf7;--sub:#8aa0c4;

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55;padding:10px;font-size:14px}
.wrap{max-width:760px;margin:0 auto}

.sub{text-align:center;color:var(--sub);font-size:12px;margin-bottom:10px}
.warn{background:#2a1418;color:#ff9a9a;border:1px solid #5a2630;border-radius:10px;padding:8px 10px;font-size:12px;text-align:center;margin-bottom:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}
.row label{width:54px;color:var(--sub);flex-shrink:0;font-size:13px}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 9px;font-size:14px;flex:1;width:100%}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;margin-top:8px;background:linear-gradient(135deg,#2563eb,#7c3aed)}
.btn:active{opacity:.86}
.btn.s{font-size:13px;padding:10px}
.btnrow{display:flex;gap:8px}
.btnrow .btn{margin-top:0}
.hint{text-align:center;color:var(--gold);font-size:12px;min-height:16px;margin-top:6px}
.ball{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin:2px}
.r{background:#c81e2c;color:#fff}.b{background:#1565d8;color:#fff}.g{background:#37475f;color:#cdd}
.gong-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.cell{border:1px solid var(--line);border-radius:10px;padding:6px;font-size:11px;min-height:96px;position:relative;background:var(--panel2)}
.cell.kong{background:#241016;border-color:#6a2a36}
.cell.zf{box-shadow:0 0 0 2px var(--gold) inset}
.cell.zs{box-shadow:0 0 0 2px var(--cyan) inset}
.gnum{position:absolute;top:3px;left:5px;color:var(--gold);font-weight:700;font-size:12px}
.lay{display:flex;flex-wrap:wrap;gap:2px 6px;margin-top:18px}
.lay b{color:var(--cyan)}
.tag{font-size:10px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
th,td{border:1px solid var(--line);padding:4px 5px;text-align:center}
th{background:var(--panel2);color:var(--gold)}
.zf-t{color:var(--gold);font-weight:700}
.zs-t{color:var(--cyan);font-weight:700}
.crash{background:#2a1015}

.note-h{color:var(--cyan);font-size:12px;margin-bottom:3px}
.bet-line{margin:4px 0;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.stat{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line);font-size:12px}

textarea{width:100%;height:80px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px;font-size:12px;font-family:monospace}

<script>
"use strict";
/* =====================================================================
   奇门遁甲真盘引擎 v3.0 — 拆补法·转盘奇门·宫数合一
   ===================================================================== */
const TG=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const DZ=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const GX={1:"水",2:"土",3:"木",4:"木",5:"土",6:"金",7:"金",8:"土",9:"火"};
const G2Z={1:["子"],2:["未","申"],3:["卯"],4:["辰","巳"],6:["戌","亥"],7:["酉"],8:["丑","寅"],9:["午"]};
const CHONG={子:"午",午:"子",丑:"未",未:"丑",寅:"申",申:"寅",卯:"酉",酉:"卯",辰:"戌",戌:"辰",巳:"亥",亥:"巳"};
const LIUHE={子:"丑",丑:"子",寅:"亥",亥:"寅",卯:"戌",戌:"卯",辰:"酉",酉:"辰",巳:"申",申:"巳",午:"未",未:"午"};
const GONG_SEQ=[1,2,3,4,6,7,8,9];
const STAR_BASE={1:"蓬",2:"芮",3:"冲",4:"辅",5:"禽",6:"心",7:"柱",8:"任",9:"英"};
const STAR_FULL={1:"天蓬",2:"天芮",3:"天冲",4:"天辅",5:"天禽",6:"天心",7:"天柱",8:"天任",9:"天英"};
const STAR_WX={蓬:"水",芮:"土",冲:"木",辅:"木",禽:"土",心:"金",柱:"金",任:"土",英:"火"};
const DOOR_BASE={1:"休",2:"死",3:"伤",4:"杜",6:"开",7:"惊",8:"生",9:"景"};
const DOOR_LOOP=["休","生","伤","杜","景","死","惊","开"];
const STAR_LOOP=["蓬","芮","冲","辅","禽","心","柱","任","英"];
const GOD_YANG=["值符","螣蛇","太阴","六合","白虎","玄武","九地","九天"];
const GOD_YIN=["值符","九天","九地","玄武","白虎","六合","太阴","螣蛇"];
const SANQI_LIUYI=["戊","己","庚","辛","壬","癸","丁","丙","乙"];
const XUN_SHOU={0:"戊",1:"己",2:"庚",3:"辛",4:"壬",5:"癸"};
const JZ=Array.from({length:60},(_,i)=>TG[i%10]+DZ[i%12]);
const YANG_DUN={"冬至":[1,7,4],"小寒":[2,8,5],"大寒":[3,9,6],"立春":[8,5,2],"雨水":[9,6,3],"惊蛰":[1,7,4],"春分":[3,9,6],"清明":[4,1,7],"谷雨":[5,2,8],"立夏":[4,1,7],"小满":[5,2,8],"芒种":[6,3,9]};
const YIN_DUN={"夏至":[9,3,6],"小暑":[8,2,5],"大暑":[7,1,4],"立秋":[2,5,8],"处暑":[1,4,7],"白露":[9,3,6],"秋分":[7,1,4],"寒露":[6,9,3],"霜降":[5,8,2],"立冬":[6,9,3],"小雪":[5,8,2],"大雪":[4,7,1]};
const YANG_LIST=Object.keys(YANG_DUN);
const JIEQI_ALL=["春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至","小寒","大寒","立春","雨水","惊蛰"];
const JQ_APPROX=[[3,20],[3,4],[4,20],[5,5],[5,21],[6,5],[6,21],[7,7],[7,23],[8,7],[8,23],[9,7],[9,23],[10,8],[10,23],[11,7],[11,22],[12,7],[12,21],[1,5],[1,20],[2,4],[2,19],[3,5]];
const NUM2GONG={1:1,11:1,21:1,31:1,2:2,12:2,22:2,32:2,3:3,13:3,23:3,33:3,4:4,14:4,24:4,5:5,15:5,25:5,35:5,6:6,16:6,26:6,7:7,17:7,27:7,8:8,18:8,28:8,9:9,19:9,29:9,10:5,20:5,30:5};
const HIS_DATA=[
["2026-11-01",[4,6,10,15,26,27],11],["2026-10-29",[3,11,17,22,23,29],9],
["2026-10-27",[4,5,20,21,26,30],12],["2026-10-25",[1,2,4,17,19,30],9],
["2026-10-22",[2,7,20,24,26,30],2],["2026-10-20",[13,14,16,18,20,31],3],
["2026-10-18",[12,22,23,25,27,30],4],["2026-10-15",[5,21,22,23,28,31],14],
["2026-10-13",[4,11,14,22,26,27],4],["2026-10-11",[10,19,24,27,28,33],12],
["2026-10-08",[4,13,14,18,22,24],3],["2026-10-06",[7,18,23,24,29,31],10],
["2026-10-04",[3,4,20,24,29,30],11],["2026-09-29",[1,4,11,12,17,29],11],
["2026-09-27",[6,7,14,22,31,32],5],["2026-09-24",[2,5,16,19,26,32],14],
["2026-09-22",[9,12,15,26,30,33],6],["2026-09-20",[6,11,13,14,20,28],16],
["2026-09-17",[1,5,9,17,24,33],4],["2026-09-15",[6,11,13,14,22,30],14],
["2026-09-13",[2,4,13,14,15,30],8],["2026-09-10",[11,12,13,19,20,31],3],
["2026-09-08",[4,11,20,27,28,30],15],["2026-09-06",[3,4,10,13,16,25],9],
["2026-09-03",[5,6,8,9,24,25],12],["2026-09-01",[3,4,9,13,22,31],4],
["2026-08-30",[1,12,14,18,30,31],2],["2026-08-27",[8,16,18,22,25,26],7],
["2026-08-25",[5,16,24,26,29,30],2],["2026-08-23",[1,4,16,22,26,31],4]
];

/* ====================== 2. 天文节气 ====================== */
function julianDayDay(date){let y=date.getUTCFullYear(),m=date.getUTCMonth()+1,d=date.getUTCDate();return julianDay(y,m,d)+0.5;};
function toJD(y,m,d,h,mi,s){h=h||0;mi=mi||0;s=s||0;let a=Math.floor((14-m)/12);let yy=y+4800-a;let mm=m+12*a-3;let jdn=d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;return jdn+(h-12)/24+mi/1440+s/86400;}
function sunApparentLongitude(jd){let T=(jd-2451545.0)/36525.0;let L0=280.46646+36000.76983*T+0.0003032*T*T;let M=357.52911+35999.05029*T-0.0001537*T*T;let Mr=M*Math.PI/180;let C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(Mr)+(0.019993-0.000101*T)*Math.sin(2*Mr)+0.000289*Math.sin(3*Mr);let trueLong=L0+C;let Omega=125.04-1934.136*T;let app=trueLong-0.00569-0.00478*Math.sin(Omega*Math.PI/180);return((app%360)+360)%360;}
function dLambdaDt(jd){let h=1e-4;return(sunApparentLongitude(jd+h)-sunApparentLongitude(jd-h))/(2*h);}
function getJieQiJD(year,idx){let target=(idx*15)%360;let ap=JQ_APPROX[idx];let jd=toJD(year,ap[0],ap[1],0,0,0);for(let i=0;i<10;i++){let lam=sunApparentLongitude(jd);let diff=((target-lam)%360+360)%360;if(diff>180)diff-=360;let deriv=dLambdaDt(jd);if(Math.abs(deriv)<1e-9)break;let step=diff/deriv;jd+=step;if(Math.abs(step)<1e-8)break;}return jd;}
function jdToUTC(jd){let z=Math.floor(jd+0.5);let f=jd+0.5-z;let a=Math.floor((z-1867216.25)/36524.25);let aa=z+1+a-Math.floor(a/4);let b=aa+1524;let c=Math.floor((b-122.1)/365.25);let d=Math.floor(365.25*c);let e=Math.floor((b-d)/30.6001);let day=b-d-Math.floor(30.6001*e)+f;let month=e<14?e-1:e-13;let year=month>2?c-4716:c-4715;let h=(day-Math.floor(day))*24;let mi=(h-Math.floor(h))*60;let s=(mi-Math.floor(mi))*60;return new Date(Date.UTC(year,month-1,Math.floor(day),Math.floor(h),Math.floor(mi),Math.round(s)));}
function activeJieQi(date){let y=date.getUTCFullYear();let all=[];[y-1,y,y+1].forEach(yy=>{JIEQI_ALL.forEach((name,idx)=>{all.push({name:name,t:jdToUTC(getJieQiJD(yy,idx)).getTime()});});});all.sort((a,b)=>a.t-b.t);let jd=julianDayDay(date);let now=jdToUTC(jd+0.5).getTime();let cur=all[0].name;for(let i=0;i<all.length;i++){if(all[i].t<=now)cur=all[i].name;else break;}return cur;}

/* ====================== 3. 干支历（四柱） ====================== */
function julianDay(y,m,d){let a=Math.floor((14-m)/12);let yy=y+4800-a;let mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045-0.5;}
function dayGanZhi(date){let y=date.getUTCFullYear(),m=date.getUTCMonth()+1,d=date.getUTCDate();let h=date.getUTCHours();if(h>=23){let nd=new Date(date.getTime()+86400000);y=nd.getUTCFullYear();m=nd.getUTCMonth()+1;d=nd.getUTCDate();}let jd=julianDay(y,m,d);let idx=((Math.floor(jd)+49)%60+60)%60;return{gan:TG[idx%10],zhi:DZ[idx%12],gz:JZ[idx],idx:idx};}
function yearGanZhi(date){let jq=activeJieQi(date);let y=date.getUTCFullYear();let lichun=jdToUTC(getJieQiJD(y,21));let realYear=date.getTime()>=lichun.getTime()?y:y-1;let offset=((realYear-1984)%60+60)%60;return JZ[offset];}
function monthGanZhi(date){let order=["冬至","小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪"];let mi=order.indexOf(activeJieQi(date));let monthBranch=mi%12;let yGan=TG.indexOf(yearGanZhi(date)[0]);let start={0:2,1:4,2:6,3:8,4:0,5:2,6:4,7:6,8:8,9:0}[yGan];let ganIdx=(start+monthBranch)%10;return TG[ganIdx]+DZ[(monthBranch+2)%12];}
function hourGanZhi(date,shiIdx){let dz=dayGanZhi(date);let dayGan=TG.indexOf(dz.gan);let start={0:0,1:2,2:4,3:6,4:8,5:0,6:2,7:4,8:6,9:8}[dayGan];return{gan:TG[(start+shiIdx)%10],zhi:DZ[shiIdx],gz:TG[(start+shiIdx)%10]+DZ[shiIdx]};}
function fullFourPillars(date,shiIdx){return{year:yearGanZhi(date),month:monthGanZhi(date),day:dayGanZhi(date).gz,hour:hourGanZhi(date,shiIdx).gz};}

/* ====================== 4. 拆补法定局 ====================== */
function findFuTou(dayGz){let idx=JZ.indexOf(dayGz);while(idx>=0){if(TG[idx%10]==="甲"||TG[idx%10]==="己")return JZ[idx];idx--;}return null;}
function getYuan(fuTouGz){let zhi=fuTouGz[1];if(["子","午","卯","酉"].includes(zhi))return 0;if(["寅","申","巳","亥"].includes(zhi))return 1;return 2;}
function dingJu(date){let jq=activeJieQi(date);let isYang=YANG_LIST.includes(jq);let table=isYang?YANG_DUN:YIN_DUN;let dayGz=dayGanZhi(date).gz;let fuTou=findFuTou(dayGz);let yuan=getYuan(fuTou);return{jieqi:jq,yinyang:isYang?"阳":"阴",yuan:["上元","中元","下元"][yuan],ju:table[jq][yuan],fuTou:fuTou};}

/* ====================== 5. 地盘三奇六仪 ====================== */
function buildDiPan(ju,yinyang){let dp={};let startIdx=GONG_SEQ.indexOf(ju);SANQI_LIUYI.forEach((gan,i)=>{let pos=yinyang==="阳"?GONG_SEQ[(startIdx+i)%8]:GONG_SEQ[(startIdx-i+8)%8];if(pos===5)pos=2;dp[pos]=gan;});return dp;}

/* ====================== 6. 旬首 / 值符 / 值使 ====================== */
function getXunShou(hourGz){let idx=JZ.indexOf(hourGz);let xsIdx=idx;while(xsIdx>=0){if(TG[xsIdx%10]==="甲")break;xsIdx--;}if(xsIdx<0)xsIdx=0;let xsGan=TG[xsIdx%10];let xsZhi=DZ[xsIdx%12];let xuIdx=Math.floor(xsIdx/10);let liuyi=XUN_SHOU[xuIdx];return{xsGz:JZ[xsIdx],xsGan:xsGan,xsZhi:xsZhi,liuyi:liuyi,xsIdx:xsIdx};}
function locateGan(dp,gan){for(let g=1;g<=9;g++){if(dp[g]===gan)return g;}return 2;}

/* ====================== 7. 转盘 ====================== */
function paiPan(date,shiIdx){
  let fp=fullFourPillars(date,shiIdx);
  let dj=dingJu(date);
  let dp=buildDiPan(dj.ju,dj.yinyang);
  let xs=getXunShou(fp.hour);
  let xsGong=locateGan(dp,xs.liuyi);if(xsGong===5)xsGong=2;
  let zfStar=STAR_BASE[xsGong];
  let zfDoor=DOOR_BASE[xsGong];
  let shiGan=fp.hour[0];
  let shiGong=locateGan(dp,shiGan);if(shiGong===5)shiGong=2;
  let starPos={};let loopIdx=STAR_LOOP.indexOf(zfStar);let shiGongOrder=GONG_SEQ.indexOf(shiGong);
  GONG_SEQ.forEach((g,i)=>{let off=dj.yinyang==="阳"?(i-shiGongOrder+8)%8:(shiGongOrder-i+8)%8;starPos[g]=STAR_LOOP[(loopIdx+off)%8];});
  starPos[5]="禽";
  let starOrigin={};GONG_SEQ.forEach(g=>{starOrigin[STAR_BASE[g]]=g;});
  let tianPan={};GONG_SEQ.forEach(g=>{let star=starPos[g];let origin=starOrigin[star]||2;tianPan[g]=dp[origin];});
  tianPan[5]=tianPan[2];
  let zsOrigin=GONG_SEQ.indexOf(xsGong);let doorLoopIdx=DOOR_LOOP.indexOf(zfDoor);
  let xsZhiIdx=DZ.indexOf(xs.xsZhi);let shiZhiIdx=shiIdx;
  let steps=dj.yinyang==="阳"?(shiZhiIdx-xsZhiIdx+12)%12:(xsZhiIdx-shiZhiIdx+12)%12;
  let doorPos={};
  GONG_SEQ.forEach((g,i)=>{let off=dj.yinyang==="阳"?(i-zsOrigin+8)%8:(zsOrigin-i+8)%8;let realOff=off+steps*(dj.yinyang==="阳"?1:-1);doorPos[g]=DOOR_LOOP[((doorLoopIdx+realOff)%8+8)%8];});
  doorPos[5]="死";
  let zsGong=2;for(let g=1;g<=9;g++){if(doorPos[g]===zfDoor){zsGong=g;break;}}
  let zfGongNow=shiGong;
  let godPos={};let godSeq=dj.yinyang==="阳"?GOD_YANG:GOD_YIN;let zfOrderIdx=GONG_SEQ.indexOf(zfGongNow);
  GONG_SEQ.forEach((g,i)=>{let off=dj.yinyang==="阳"?(i-zfOrderIdx+8)%8:(zfOrderIdx-i+8)%8;godPos[g]=godSeq[off%8];});
  godPos[5]=godPos[2];
  let kongZhi=[DZ[(xsZhiIdx+10)%12],DZ[(xsZhiIdx+11)%12]];
  let kongGong=[];kongZhi.forEach(z=>{GONG_SEQ.forEach(g=>{if((G2Z[g]||[]).includes(z))kongGong.push(g);});});
  kongGong=Array.from(new Set(kongGong));
  return{four:fp,dj:dj,dp:dp,tianPan:tianPan,stars:starPos,doors:doorPos,gods:godPos,zfStar:zfStar,zfDoor:zfDoor,zfGong:zfGongNow,zsGong:zsGong,xs:xs,kongGong:kongGong,kongZhi:kongZhi,shiGong:shiGong,xsGong:xsGong};
}

/* ====================== 8. 评分 ====================== */
function getBaseGong(pan,baseType){
  if(baseType==="rigan")return locateGan(pan.tianPan,pan.four.day[0]);
  if(baseType==="shigan")return pan.shiGong;
  if(baseType==="zhifu")return pan.zfGong;
  if(baseType==="xiumen"){for(let g=1;g<=9;g++)if(pan.doors[g]==="休")return g;return 1;}
  if(baseType==="liuhe"){for(let g=1;g<=9;g++)if(pan.gods[g]==="六合")return g;return 1;}
  return pan.zfGong;
}
function wuxingScore(baseWx,gWx,starWx){
  const SHENG={"水":"木","木":"火","火":"土","土":"金","金":"水"};
  const KE={"水":"火","火":"金","金":"木","木":"土","土":"水"};
  let sc=0;
  if(SHENG[baseWx]===gWx)sc+=6;
  else if(KE[gWx]===baseWx)sc+=8;
  else if(SHENG[gWx]===baseWx)sc-=4;
  if(SHENG[starWx]===gWx)sc+=10;
  if(KE[starWx]===gWx)sc-=8;
  return sc;
}
function scoreGongs(pan,baseType){
  let baseGong=getBaseGong(pan,baseType);
  let baseWx=GX[baseGong===5?2:baseGong];
  let res={};
  GONG_SEQ.forEach(g=>{
    let gg=g===5?2:g;
    let gWx=GX[gg];let starName=pan.stars[g]==="禽"?STAR_BASE[5]:pan.stars[g];let starWx=STAR_WX[starName];
    let sc=wuxingScore(baseWx,gWx,starWx);
    if(g===pan.zfGong)sc+=5;
    if(g===pan.zsGong)sc+=3;
    if(pan.gods[g]==="六合")sc+=2;
    if(pan.gods[g]==="九天")sc+=2;
    if(pan.gods[g]==="太阴")sc+=1;
    if(pan.gods[g]==="白虎")sc-=2;
    if(pan.gods[g]==="玄武")sc-=2;
    if(pan.kongGong.includes(g))sc-=6;
    if(STAR_BASE[g]===pan.stars[g])sc+=4;
    res[g]=sc;
  });
  return{scores:res,baseWx:baseWx,baseGong:baseGong};
}

/* ====================== 9. 宫数合一取号 ====================== */
function buildPool(pan,baseType,lt){
  let cfg=lt==="dlt"?{frontMax:35,backMax:12,frontPick:5,backPick:2,need:16,backCandidate:6}
                    :{frontMax:33,backMax:16,frontPick:6,backPick:1,need:16,backCandidate:6};
  let{scores}=scoreGongs(pan,baseType);
  let sortedGongs=GONG_SEQ.slice().sort((a,b)=>scores[b]-scores[a]);
  let front=[],used={};
  for(let gi=0;gi<sortedGongs.length;gi++){
    let g=sortedGongs[gi];let gg=g===5?2:g;
    Object.keys(NUM2GONG).forEach(nStr=>{
      let n=parseInt(nStr);
      if(NUM2GONG[n]===gg&&n<=cfg.frontMax&&!used[n]){front.push(n);used[n]=true;}
    });
    if(front.length>=cfg.need)break;
  }
  for(let n=1;n<=cfg.frontMax&&front.length<cfg.need;n++){if(!used[n]){front.push(n);used[n]=true;}}
  if(front.length>18)front=front.slice(0,18);
  let backCandidates=[];
  for(let gi=0;gi<sortedGongs.length;gi++){
    let g=sortedGongs[gi];let gg=g===5?2:g;
    Object.keys(NUM2GONG).forEach(nStr=>{
      let n=parseInt(nStr);
      if(NUM2GONG[n]===gg&&n<=cfg.backMax&&!used[n]){backCandidates.push(n);used[n]=true;}
    });
    if(backCandidates.length>=cfg.backCandidate)break;
  }
  for(let n=1;n<=cfg.backMax&&backCandidates.length<cfg.backCandidate;n++){if(!used[n]){backCandidates.push(n);used[n]=true;}}
  return{front:front,back:backCandidates,cfg:cfg};
}
function shuffle(arr){let a=arr.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function genBets(pool,lt){
  let out=[];let f=pool.front.slice(),b=pool.back.slice();
  for(let i=0;i<5;i++){
    let fp=shuffle(f).slice(0,pool.cfg.frontPick).sort((a,c)=>a-c);
    while(fp.length<pool.cfg.frontPick){let t=f[Math.floor(Math.random()*f.length)];if(!fp.includes(t))fp.push(t);fp.sort((a,c)=>a-c);}
    let bp=shuffle(b).slice(0,pool.cfg.backPick).sort((a,c)=>a-c);
    while(bp.length<pool.cfg.backPick){let t=b[Math.floor(Math.random()*b.length)];if(!bp.includes(t))bp.push(t);bp.sort((a,c)=>a-c);}
    out.push({f:fp,b:bp});
  }
  return out;
}

/* ====================== 10. 回测 ====================== */
function runBacktestOn(panFn,data,lt){
  let hits=[];let frontHitSum=0,backHitSum=0;
  data.forEach(rec=>{
    let date=new Date(rec[0]+"T00:00:00Z");
    let pan=panFn(date,11);
    let pool=buildPool(pan,"zhifu",lt);
    let openF=rec[1],openB=Array.isArray(rec[2])?rec[2]:[rec[2]];
    let fh=openF.filter(n=>pool.front.includes(n)).length;
    let bh=openB.filter(n=>pool.back.includes(n)).length;
    frontHitSum+=fh;backHitSum+=bh;
    hits.push({d:rec[0],fh:fh,bh:bh});
  });
  return{total:data.length,avgF:(frontHitSum/data.length).toFixed(2),avgB:(backHitSum/data.length).toFixed(2),hits:hits};
}
function histHTML(hits,key,max){
  let rows="";let cnt={};
  hits.forEach(h=>{let k=h[key];cnt[k]=(cnt[k]||0)+1;});
  for(let k=0;k<=max;k++){let c=cnt[k]||0;let p=max?Math.round(c/hits.length*100):0;rows+=`<tr><td>${k}</td><td>${c}</td><td>${p}%</td><td><span style="display:inline-block;height:8px;background:var(--cyan);width:${p*2}px"></span></td></tr>`;}
  return rows;
}

/* ====================== 11. UI ====================== */
function pad(n){return String(n).padStart(2,"0");}
function show(id){document.getElementById(id).classList.remove("hide");}
function $(id){return document.getElementById(id);}
function run(){
  try{
    let dStr=$("date").value,shi=+$("shi").value,lt=$("lt").value,base=$("base").value;
    if(!dStr){alert("请选择日期");return;}
    let date=new Date(dStr+"T00:00:00Z");
    let pan=paiPan(date,shi);
    let{four,dj,dp,tianPan,stars,doors,gods,zfGong,zsGong,kongGong,four:fp}=pan;
    let sc=scoreGongs(pan,base);
    let pool=buildPool(pan,base,lt);
    let bets=genBets(pool,lt);
    show("out-info");show("out-grid");show("out-table");show("out-pool");show("out-bets");show("out-check");
    $("info-body").innerHTML=
      `<div style="color:#ffdd99;font-size:13px">年柱：<b>${fp.year}</b>　月柱：<b>${fp.month}</b>　日柱：<b>${fp.day}</b>　时柱：<b>${fp.hour}</b></div>
       <div style="color:#ffdd99;font-size:13px;margin-top:4px">节气：<b>${dj.jieqi}</b>　${dj.yinyang}遁<b>${dj.ju}</b>局　${dj.yuan}　符头：<b>${dj.fuTou}</b></div>
       <div style="color:#ffdd99;font-size:13px;margin-top:4px">基准宫：<b class="zf-t">${sc.baseGong}宫(${sc.baseWx})</b>　值符宫：<b class="zf-t">${zfGong}宫</b>　值使宫：<b class="zs-t">${zsGong}宫</b></div>`;
    let cells="";
    GONG_SEQ.concat([5]).forEach(g=>{
      let gg=g===5?2:g;
      let crash=kongGong.includes(gg)?"kong":"";
      let zfcls=gg===zfGong?"zf":"";let zscls=gg===zsGong?"zs":"";
      cells+=`<div class="cell ${crash} ${zfcls} ${zscls}">
        <div class="gnum">${g}宫</div>
        <div class="lay">地:<b>${dp[gg]||'-'}</b> 天:<b>${tianPan[gg]||'-'}</b></div>
        <div class="lay">星:<b>${STAR_FULL[stars[gg]]||'-'}</b></div>
        <div class="lay">门:<b>${doors[gg]||'-'}</b></div>
        <div class="lay">神:<b>${gods[gg]||'-'}</b> 分:<b style="color:#ffd24a">${sc.scores[g]}</b></div>
      </div>`;
    });
    $("grid-body").innerHTML=cells;
    let rows="";
    GONG_SEQ.forEach(g=>{
      let crash=kongGong.includes(g)?"crash":"";
      rows+=`<tr class="${crash}"><td>${g}宫</td><td>${GX[g===5?2:g]}</td><td>${dp[g]||'-'}</td><td>${tianPan[g]||'-'}</td><td>${STAR_FULL[stars[g]]||'-'}</td><td>${doors[g]||'-'}</td><td>${gods[g]||'-'}</td><td style="color:#ffd24a">${sc.scores[g]}</td></tr>`;
    });
    $("table-body").innerHTML=`<table><tr><th>宫</th><th>五行</th><th>地盘</th><th>天盘</th><th>九星</th><th>八门</th><th>八神</th><th>得分</th></tr>${rows}</table>`;
    $("pool-body").innerHTML=`<div style="font-size:13px;color:#8aa0c4;margin-bottom:6px">前区池 ${pool.front.length} 个 / 后区候选 ${pool.back.length} 个</div>
      <div>前区：${pool.front.map(n=>`<span class="ball r">${pad(n)}</span>`).join("")}</div>
      <div style="margin-top:6px">后区：${pool.back.map(n=>`<span class="ball b">${pad(n)}</span>`).join("")}</div>`;
    $("bet-body").innerHTML=bets.map((b,i)=>`<div class="note"><div class="note-h">第${i+1}注</div>
      <div class="bet-line">${b.f.map(n=>`<span class="ball r">${pad(n)}</span>`).join("")}
      <span style="color:#ffd24a;margin:0 6px">+</span>${b.b.map(n=>`<span class="ball b">${pad(n)}</span>`).join("")}</div></div>`).join("");
    let today=dStr,rec=HIS_DATA.find(h=>h[0]===today);
    let ch="";
    if(rec){
      let openB=Array.isArray(rec[2])?rec[2]:[rec[2]];
      let fh=rec[1].filter(n=>pool.front.includes(n)),bh=openB.filter(n=>pool.back.includes(n));
      ch=`开奖：${rec[1].map(pad).join(" ")} + ${openB.map(pad).join(" ")}<br>
        前区命中 <span class="zf-t">${fh.length}/${pool.cfg.frontPick}</span> [${fh.map(pad).join(" ")||"无"}]　　
        后区命中 <span class="zf-t">${bh.length}/${pool.cfg.backPick}</span> [${bh.map(pad).join(" ")||"无"}]`;
    }else ch="当日无内置开奖记录，可切到回测面板批量自查。";
    $("check-body").innerHTML=ch;
  }catch(e){console.error(e);alert("排盘出错："+e.message);}
}
function quick(lt){
  $("lt").value=lt;
  let d=new Date(),days=lt==="dlt"?[1,3,6]:[0,2,4],got=false;
  for(let i=0;i<14&&!got;i++){let t=new Date(d.getTime()+i*86400000);if(days.includes(t.getUTCDay())){$("date").value=t.toISOString().split("T")[0];got=true;}}
  $("hint").innerText="已定位下一期"+{"dlt":"大乐透","ssq":"双色球"}[lt]+"开奖日，默认亥时";
}
function toggleBT(){let el=$("out-bt");el.classList.toggle("hide");if(!el.classList.contains("hide"))runBT("dlt");}
function runBT(lt){
  let r=runBacktestOn(paiPan,HIS_DATA,lt);
  $("bt-body").innerHTML=`<div style="color:#ffdd99;font-size:13px;margin-bottom:6px">内置 ${r.total} 期 · ${lt==="dlt"?"大乐透":"双色球"}</div>
    <div class="stat"><span>前区场均命中</span><span>${r.avgF} 个</span></div>
    <div class="stat"><span>后区场均命中</span><span>${r.avgB} 个</span></div>
    <div style="margin-top:8px"><table><tr><th>前区命中数</th><th>期数</th><th>占比</th><th></th></tr>${histHTML(r.hits,"fh",lt==="dlt"?5:6)}</table></div>
    <div style="margin-top:6px"><table><tr><th>后区命中数</th><th>期数</th><th>占比</th><th></th></tr>${histHTML(r.hits,"bh",lt==="dlt"?2:1)}</table></div>`;
}
function parseCustom(text){
  let out=[];
  text.split(/\n+/).forEach(line=>{
    let p=line.split(/[,，\t]/).map(s=>s.trim()).filter(Boolean);
    if(p.length<2)return;
    let d=p[0];let f=p[1].split(/\s+/).map(Number).filter(n=>n>0);let b=[parseInt(p[2])].filter(n=>!isNaN(n));
    if(f.length)out.push([d,f,b.length?b[0]:0]);
  });
  return out;
}
function runCustomBT(){
  let data=parseCustom($("custom").value);
  if(!data.length){alert("请按格式填入数据");return;}
  let lt=$("lt").value;
  let r=runBacktestOn(paiPan,data,lt);
  $("bt-body").innerHTML=`<div style="color:#5be39a;font-size:13px;margin-bottom:6px">自定义数据 ${r.total} 期</div>`+
    `<div class="stat"><span>前区场均命中</span><span>${r.avgF} 个</span></div>`+
    `<div class="stat"><span>后区场均命中</span><span>${r.avgB} 个</span></div>`+
    `<div style="margin-top:6px;max-height:260px;overflow:auto"><table><tr><th>日期</th><th>前区命中</th><th>后区命中</th></tr>`+
    r.hits.map(h=>`<tr><td>${h.d}</td><td>${h.fh}</td><td>${h.bh}</td></tr>`).join("")+`</table></div>`;
}
(function(){let d=new Date();$("date").value=d.toISOString().split("T")[0];quick("dlt");})();
</script>
