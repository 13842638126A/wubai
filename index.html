<style>

<body>
<div class="warn">彩票开奖完全随机，本工具仅为奇门模型统计研究，不具备预测能力，理性购彩。</div>
<h1>奇门遁甲 · 生子救母推荐</h1>
<div class="panel">
<h2>推演设置</h2>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0;">
<div><label>日期：</label><input id="calcDate" type="date" style="width:100%;"></div>
<div><label>时辰：</label><select id="calcShiChen" style="width:100%;">
<option value="0">子</option><option value="1">丑</option><option value="2">寅</option><option value="3">卯</option>
<option value="4">辰</option><option value="5">巳</option><option value="6">午</option><option value="7">未</option>
<option value="8">申</option><option value="9">酉</option><option value="10">戌</option><option value="11" selected>亥</option>
</select></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0;">
<div><label>彩种：</label><select id="lotteryType" style="width:100%;">
<option value="ssq" selected>双色球</option><option value="dlt">大乐透</option>
</select></div>
<div><label>基准：</label><select id="baseTarget" style="width:100%;">
<option value="riGan" selected>日干五行</option><option value="shiGan">时干五行</option><option value="zhiFu">值符宫</option>
</select></div>
</div>
<div id="drawTimeHint" style="color:#ffd343;font-size:13px;margin-top:6px;text-align:center;"></div>
<button id="runBtn" class="green" style="margin-top:8px;">排盘推演 + 推荐5注</button>
</div>
<div id="outputArea" style="display:none;">
<div class="panel"><h2>九宫盘面</h2><div id="jiugongBox"></div><div id="panInfoLine"></div></div>
<div class="panel"><h2>号码池</h2><div id="poolInfo"></div></div>
<div class="panel"><h2>推荐5注</h2><div id="betsArea"></div></div>
<div class="panel">
<h2>单期自查</h2>
<input id="awardInput" placeholder="双色球：04 06 10 15 26 27+11 | 大乐透：02 14 21 22 24+02 12" style="width:100%;margin-top:4px;">
<button id="checkBtn" class="orange" style="margin-top:6px;">自查中奖</button>
<div id="checkResult"></div>
</div>
<div class="panel">
<h2>批量自查（历史开奖）</h2>
<textarea id="batchInput" style="margin-top:4px;" placeholder="2026-10-27 04 05 20 21 26 30+12&#10;2026-10-25 01 02 04 17 19 30+09&#10;..."></textarea>
<div style="display:flex;gap:6px;margin:6px 0;">
<button id="batchRunBtn" class="green" style="flex:1;">批量自查</button>
<button id="loadRecentBtn" style="flex:1;background:#6d28d9;">加载最近开奖</button>
</div>
<div id="batchResult"></div>
</div>
</div>
<script>
// ========== 硬编码权重（生子救母体系，31字准则）==========
var W = {
  shengWo:12, woSheng:-6, keWo:-10, woKe:-4, biHe:3,
  kongWang:-8, chong:-7, liuHe:5,
  xingShengGong:10, xingBiHe:6, gongShengXing:-4, xingKeGong:-8, gongKeXing:0,
  fuYin:10, wangJia:8
};
// 取号定量
var FRONT_MIN = 16, FRONT_MAX = 18;   // 前区取16–18位
var BACK_MIN = 5, BACK_MAX = 6;       // 后区取5–6位

// ========== 开奖星期 ==========
var DRAW_WEEKDAYS = { ssq:[2,4,0], dlt:[1,3,6] };
var DRAW_TIME_LABEL = { ssq:"21:15", dlt:"21:25" };
var WEEK_NAME = ["周日","周一","周二","周三","周四","周五","周六"];

// ========== 基础常量 ==========
var tianGan=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
var diZhi=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
var ganWuxing={"甲":"木","乙":"木","丙":"火","丁":"火","戊":"土","己":"土","庚":"金","辛":"金","壬":"水","癸":"水"};
var chongDizhi={"子":"午","丑":"未","寅":"申","卯":"酉","辰":"戌","巳":"亥","午":"子","未":"丑","申":"寅","酉":"卯","戌":"辰","亥":"巳"};
var xunKongTable={"甲子旬":["戌","亥"],"甲戌旬":["申","酉"],"甲申旬":["午","未"],"甲午旬":["辰","巳"],"甲辰旬":["寅","卯"],"甲寅旬":["子","丑"]};
var wuxingSheng={"水":"金","金":"土","土":"火","火":"木","木":"水"};
var wuxingMap={
  "水":{shengWo:"金",woSheng:"木",keWo:"土",woKe:"火",tong:"水"},
  "木":{shengWo:"水",woSheng:"火",keWo:"金",woKe:"土",tong:"木"},
  "火":{shengWo:"木",woSheng:"土",keWo:"水",woKe:"金",tong:"火"},
  "土":{shengWo:"火",woSheng:"金",keWo:"木",woKe:"水",tong:"土"},
  "金":{shengWo:"土",woSheng:"水",keWo:"火",woKe:"木",tong:"金"}
};
var XING_WUXING={"蓬":"水","芮":"土","冲":"木","辅":"木","禽":"土","心":"金","柱":"金","任":"土","英":"火"};
var XING_FULL={"蓬":"天蓬","芮":"天芮","冲":"天冲","辅":"天辅","禽":"天禽","心":"天心","柱":"天柱","任":"天任","英":"天英"};
var SHEN_LIST=["值符","螣蛇","太阴","六合","白虎","玄武","九地","九天"];
var GONG_ORDER=[1,2,3,4,6,7,8,9];
var palaceMeta={
  1:{name:"坎",tianXian:[1],houTian:[6],origXing:"蓬",origMen:"休",wuXing:"水",dizhi:["子"],jiXiong:"吉"},
  2:{name:"坤",tianXian:[2],houTian:[8],origXing:"芮",origMen:"死",wuXing:"土",dizhi:["未","申"],jiXiong:"凶"},
  3:{name:"震",tianXian:[3],houTian:[4],origXing:"冲",origMen:"伤",wuXing:"木",dizhi:["卯"],jiXiong:"凶"},
  4:{name:"巽",tianXian:[4],houTian:[3],origXing:"辅",origMen:"杜",wuXing:"木",dizhi:["辰","巳"],jiXiong:"平"},
  5:{name:"中五",tianXian:[5],houTian:[5],origXing:"禽",origMen:"禽",wuXing:"土",dizhi:[],jiXiong:"平"},
  6:{name:"乾",tianXian:[6],houTian:[1],origXing:"心",origMen:"开",wuXing:"金",dizhi:["戌","亥"],jiXiong:"吉"},
  7:{name:"兑",tianXian:[7],houTian:[2],origXing:"柱",origMen:"惊",wuXing:"金",dizhi:["酉"],jiXiong:"凶"},
  8:{name:"艮",tianXian:[8],houTian:[7],origXing:"任",origMen:"生",wuXing:"土",dizhi:["丑","寅"],jiXiong:"吉"},
  9:{name:"离",tianXian:[9],houTian:[9],origXing:"英",origMen:"景",wuXing:"火",dizhi:["午"],jiXiong:"平"}
};
var gridOrder=[4,9,2,3,5,7,8,1,6];
var liuYi=["戊","己","庚","辛","壬","癸","丁","丙","乙"];
var gongDizhiMap={1:["子"],2:["未","申"],3:["卯"],4:["辰","巳"],5:[],6:["戌","亥"],7:["酉"],8:["丑","寅"],9:["午"]};
var solarTerms=[
  {name:"小寒",m:1,d:6},{name:"大寒",m:1,d:20},{name:"立春",m:2,d:4},{name:"雨水",m:2,d:19},
  {name:"惊蛰",m:3,d:6},{name:"春分",m:3,d:21},{name:"清明",m:4,d:5},{name:"谷雨",m:4,d:20},
  {name:"立夏",m:5,d:6},{name:"小满",m:5,d:21},{name:"芒种",m:6,d:6},{name:"夏至",m:6,d:21},
  {name:"小暑",m:7,d:7},{name:"大暑",m:7,d:23},{name:"立秋",m:8,d:7},{name:"处暑",m:8,d:23},
  {name:"白露",m:9,d:8},{name:"秋分",m:9,d:23},{name:"寒露",m:10,d:8},{name:"霜降",m:10,d:23},
  {name:"立冬",m:11,d:7},{name:"小雪",m:11,d:22},{name:"大雪",m:12,d:7},{name:"冬至",m:12,d:22}
];
var dingJuTable={
  "冬至":[1,4,7],"小寒":[2,5,8],"大寒":[3,6,9],"立春":[8,5,2],"雨水":[9,6,3],"惊蛰":[1,7,4],
  "春分":[3,9,6],"清明":[4,1,7],"谷雨":[5,2,8],"立夏":[4,1,7],"小满":[5,2,8],"芒种":[6,3,9],
  "夏至":[9,3,6],"小暑":[8,2,5],"大暑":[7,1,4],"立秋":[2,5,8],"处暑":[1,4,7],"白露":[9,3,6],
  "秋分":[7,1,4],"寒露":[6,9,3],"霜降":[5,8,2],"立冬":[6,9,3],"小雪":[5,8,2],"大雪":[4,7,1]
};
var yangTerms=["冬至","小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种"];

// ========== 宫数合一：个位定宫归属表 ==========
// 1宫水:1,11,21,31 | 2宫土:2,22,32 | 3宫木:3,13,23,33 | 4宫木:4,14,24
// 5宫土:5,15,25,35,10,20,30 | 6宫金:6,16,26 | 7宫金:7,17,27 | 8宫土:8,18,28 | 9宫火:9,19,29
var NUM_TO_GONG = {};
(function buildNumGong(){
  var map={
    1:[1,11,21,31],2:[2,22,32],3:[3,13,23,33],4:[4,14,24],
    5:[5,15,25,35,10,20,30],6:[6,16,26],7:[7,17,27],8:[8,18,28],9:[9,19,29]
  };
  for(var g=1;g<=9;g++){
    var arr=map[g];
    for(var i=0;i<arr.length;i++){ NUM_TO_GONG[arr[i]]=g; }
  }
})();
function numToGong(n){ return NUM_TO_GONG[n]; }
function numWuxing(n){ var g=NUM_TO_GONG[n]; return g?palaceMeta[g].wuXing:null; }

// ========== 下一期开奖日 ==========
function nextDrawDate(lotteryType, fromDate){
  var weekdays = DRAW_WEEKDAYS[lotteryType];
  var d = fromDate ? new Date(fromDate) : new Date();
  d.setHours(0,0,0,0);
  for(var i=0;i<7;i++){
    if(weekdays.indexOf(d.getDay())>=0) return new Date(d);
    d.setDate(d.getDate()+1);
  }
  return new Date();
}
function fmtDate(d){
  var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function syncDefaultDraw(){
  var lt=document.getElementById("lotteryType").value;
  var nd=nextDrawDate(lt, new Date());
  document.getElementById("calcDate").value=fmtDate(nd);
  document.getElementById("calcShiChen").value="11";
  var info=document.getElementById("drawTimeHint");
  info.innerText="默认下一期"+(lt==="ssq"?"双色球":"大乐透")+"开奖："+fmtDate(nd)+"（"+WEEK_NAME[nd.getDay()]+"）"+DRAW_TIME_LABEL[lt]+" · 亥时，可手动修改";
}

// ========== 排盘基础函数 ==========
function getSolarTerm(d){var m=d.getMonth()+1,dd=d.getDate();var b=null,bd=999;for(var i=0;i<solarTerms.length;i++){var s=solarTerms[i];var df=Math.abs((m-s.m)*31+(dd-s.d));if(df<bd){bd=df;b=s;}}return b.name;}
function getSeasonWuxing(st){if(["立春","雨水","惊蛰","清明","谷雨"].indexOf(st)>=0)return"木";if(["立夏","小满","芒种","小暑","大暑"].indexOf(st)>=0)return"火";if(["立秋","处暑","白露","秋分","寒露"].indexOf(st)>=0)return"金";if(["立冬","小雪","大雪","冬至","小寒"].indexOf(st)>=0)return"水";return"土";}

// 日柱：权威儒略日算法
function getDayGanZhi(d){
  var y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
  if(m<=2){y-=1;m+=12;}
  var A=Math.floor(y/100), B=2-A+Math.floor(A/4);
  var JD=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+day+B-1524;
  // 以 2000-01-01 = 戊午 为锚（JD=2451545）
  var gIndex=(JD-2451545+4)%10; if(gIndex<0)gIndex+=10;
  var zIndex=(JD-2451545+6)%12; if(zIndex<0)zIndex+=12;
  return{dayGan:tianGan[gIndex],dayZhi:diZhi[zIndex]};
}

// 旬首天干：依日支所属旬
function getXunShouGanIdx(dayGanIdx){
  return {0:0,1:50,2:40,3:30,4:20,5:10,6:0,7:50,8:40,9:30}[dayGanIdx%10];
}
function getFuTouYuan(gz){
  var gi=tianGan.indexOf(gz.dayGan),zi=diZhi.indexOf(gz.dayZhi);
  var db=0,g=gi;
  while(g!==0&&g!==5){g=(g-1+10)%10;db++;}
  var fz=(zi-db+12)%12;
  var f=diZhi[fz];
  if(["子","午","卯","酉"].indexOf(f)>=0)return 0;
  if(["寅","申","巳","亥"].indexOf(f)>=0)return 1;
  return 2;
}
function getHourGan(dayGan,si){
  return tianGan[(tianGan.indexOf(dayGan)+si)%10];
}
function getXunKong(dz){
  for(var k in xunKongTable){
    var sz=k.slice(-1);
    var zi=diZhi.indexOf(sz);
    var zl=[];
    for(var i=0;i<10;i++)zl.push(diZhi[(zi+i)%12]);
    if(zl.indexOf(dz)>=0)return{xunName:k,kongZhi:xunKongTable[k]};
  }
  return{xunName:"",kongZhi:[]};
}
function arrangeDiPan(ju,yd){
  var gs=[1,2,3,4,5,6,7,8,9],pos={},st=gs.indexOf(ju);
  for(var i=0;i<9;i++){pos[yd?gs[(st+i)%9]:gs[(st-i+9)%9]]=liuYi[i];}
  return pos;
}
function getDunJuBySolarTerm(st,yuan){
  var jues=dingJuTable[st],yd=yangTerms.indexOf(st)>=0;
  return{yangDun:yd,ju:jues[yuan]};
}
function getLiuHePartnerGongs(dayZhi){
  var partner=LIUHE_MAP[dayZhi];if(!partner)return[];
  var r=[];
  for(var g=1;g<=9;g++){if(gongDizhiMap[g]&&gongDizhiMap[g].indexOf(partner)>=0)r.push(g);}
  return r;
}
var LIUHE_MAP={"子":"丑","丑":"子","寅":"亥","亥":"寅","卯":"戌","戌":"卯","辰":"酉","酉":"辰","巳":"申","申":"巳","午":"未","未":"午"};

// ========== 拆补法排盘 ==========
function qiMenZhuanPan(dateStr,shiIdx){
  var d=new Date(dateStr);
  var gz=getDayGanZhi(d);
  var hourGan=getHourGan(gz.dayGan,shiIdx);
  var xk=getXunKong(gz.dayZhi);
  var kongZhi=xk.kongZhi;
  var solarTerm=getSolarTerm(d);
  var yuan=getFuTouYuan(gz);
  var dj=getDunJuBySolarTerm(solarTerm,yuan);
  var yangDun=dj.yangDun,ju=dj.ju;
  var diPan=arrangeDiPan(ju,yangDun);

  // 值符：依日支所属旬定位旬首天干
  var fuGanIdx=getXunShouGanIdx(tianGan.indexOf(gz.dayGan));
  var fuYuanGong=-1;
  for(var k in diPan){if(diPan[k]===tianGan[fuGanIdx%10]){fuYuanGong=Number(k);break;}}

  var hourGanIdx=tianGan.indexOf(hourGan);
  var sgGong=yangDun?((fuYuanGong-1)+hourGanIdx)%9+1:((fuYuanGong-1)-hourGanIdx+9)%9+1;
  var tianPan={};
  for(var g=1;g<=9;g++){var off=(g-sgGong+9)%9;var src=((fuYuanGong-1)+off)%9+1;tianPan[g]=diPan[src];}
  var zhiFuGong=sgGong;

  var palaceSeq=[1,2,3,4,6,7,8,9];
  var fuOrigIdx=palaceSeq.indexOf(fuYuanGong);
  var zsIdx=yangDun?(fuOrigIdx+hourGanIdx)%8:(fuOrigIdx-hourGanIdx+8)%8;
  if(palaceSeq[zsIdx]===5)zsIdx=palaceSeq.indexOf(2);
  var zhiShiGong=palaceSeq[zsIdx];

  var xingSeq=["蓬","芮","冲","辅","禽","心","柱","任","英"];
  var zfPosIdx=GONG_ORDER.indexOf(zhiFuGong);
  var rotatedXing={};
  for(var i=0;i<8;i++){
    var posIdx=yangDun?(zfPosIdx+i)%8:(zfPosIdx-i+8)%8;
    rotatedXing[GONG_ORDER[posIdx]]=xingSeq[i];
  }
  var menBase=["休","死","伤","杜","开","惊","生","景"];
  var zhiShiMen=palaceMeta[fuYuanGong].origMen;
  var menStartIdx=menBase.indexOf(zhiShiMen);
  var menArr={};
  for(var i=0;i<8;i++){
    var pi=yangDun?(zsIdx+i)%8:(zsIdx-i+8)%8;
    var mi=(menStartIdx+i)%8;
    menArr[palaceSeq[pi]]=menBase[mi];
  }
  var shen={};
  for(var i=0;i<8;i++){
    var g=yangDun?(zhiFuGong-1+i)%9+1:(zhiFuGong-1-i+9)%9+1;
    if(g===5)continue;
    shen[g]=SHEN_LIST[i];
  }
  var kongGongList=[],chongGongList=[];
  for(var ki=0;ki<kongZhi.length;ki++){
    var z=kongZhi[ki];
    for(var g=1;g<=9;g++){if(gongDizhiMap[g]&&gongDizhiMap[g].indexOf(z)>=0)kongGongList.push(g);}
    var cz=chongDizhi[z];
    for(var g=1;g<=9;g++){if(gongDizhiMap[g]&&gongDizhiMap[g].indexOf(cz)>=0)chongGongList.push(g);}
  }
  kongGongList=kongGongList.filter(function(v,i,a){return a.indexOf(v)===i;});
  chongGongList=chongGongList.filter(function(v,i,a){return a.indexOf(v)===i;});
  var liuheGongs=getLiuHePartnerGongs(gz.dayZhi);
  var seasonWX=getSeasonWuxing(solarTerm);
  var palaceData={};
  for(var g=1;g<=9;g++){
    var meta=palaceMeta[g];
    var rx=rotatedXing[g]||meta.origXing;
    var xwx=XING_WUXING[rx];
    palaceData[g]={
      name:meta.name,wuXing:meta.wuXing,dizhi:meta.dizhi,jiXiong:meta.jiXiong,
      xing:rx,xingWuxing:xwx,xingFull:XING_FULL[rx]||"天"+rx,
      diGan:diPan[g],tianGan:tianPan[g],men:menArr[g]||meta.origMen,
      shen:shen[g]||"",isZhiFu:g===zhiFuGong,isZhiShi:g===zhiShiGong,
      isChong:chongGongList.indexOf(g)>=0,isKong:kongGongList.indexOf(g)>=0,
      isLiuHe:liuheGongs.indexOf(g)>=0,isFuYin:(rx===meta.origXing),
      isWangXiang:(xwx===seasonWX)||(wuxingSheng[seasonWX]===xwx),score:0
    };
  }
  return{palaceData:palaceData,gz:gz,hourGan:hourGan,zhiFuGong:zhiFuGong,zhiShiGong:zhiShiGong,ju:ju,yangDun:yangDun,xunName:xk.xunName,solarTerm:solarTerm,yuan:yuan,kongGongList:kongGongList,chongGongList:chongGongList};
}

// ========== 评分（星宫作用关系）==========
function calcScore(palaceData,gz,hourGan,zhiFuGong,baseType){
  var baseWx;
  if(baseType==="riGan")baseWx=ganWuxing[gz.dayGan];
  else if(baseType==="shiGan")baseWx=ganWuxing[hourGan];
  else baseWx=palaceData[zhiFuGong].wuXing;
  for(var g=1;g<=9;g++){
    var p=palaceData[g];var s=0;var gwx=p.wuXing;var rel=wuxingMap[baseWx];
    if(gwx===rel.shengWo)s+=W.shengWo;
    else if(gwx===rel.woSheng)s+=W.woSheng;
    else if(gwx===rel.keWo)s+=W.keWo;
    else if(gwx===rel.woKe)s+=W.woKe;
    else if(gwx===rel.tong)s+=W.biHe;
    var xwx=p.xingWuxing;
    if(wuxingMap[xwx].woSheng===gwx)s+=W.xingShengGong;
    else if(xwx===gwx)s+=W.xingBiHe;
    else if(wuxingMap[gwx].woSheng===xwx)s+=W.gongShengXing;
    else if(wuxingMap[xwx].woKe===gwx)s+=W.xingKeGong;
    else if(wuxingMap[gwx].woKe===xwx)s+=W.gongKeXing;
    if(p.isKong)s+=W.kongWang;
    if(p.isChong)s+=W.chong;
    if(p.isLiuHe)s+=W.liuHe;
    if(p.isFuYin)s+=W.fuYin;
    if(p.isWangXiang)s+=W.wangJia;
    p.score=s;
  }
}

// ========== 取数池 ==========
// 前区16–18位：按宫得分从高到低取宫，取齐该宫归属号码，不足16则放宽到前四宫补齐，超18则限18
// 后区5–6位：五行生克排序，取6位（生我最高、克我最低）
function getNumPool(pan,lotteryType){
  var frontMax = lotteryType==="dlt" ? 35 : 33;
  var backMax  = lotteryType==="dlt" ? 12 : 16;

  var sorted=[];
  for(var g=1;g<=9;g++){sorted.push({g:g,s:pan.palaceData[g].score});}
  sorted.sort(function(a,b){return b.s-a.s;});

  var front=[];
  // 取前3宫，不足16则放宽到前4宫
  var gongCount = 3;
  for(var pass=0;pass<2;pass++){
    var limit = (pass===0) ? 3 : 4;
    for(var i=0;i<limit;i++){
      var g=sorted[i].g;
      var wx=pan.palaceData[g].wuXing;
      for(var n=1;n<=frontMax;n++){
        if(numWuxing(n)===wx && front.indexOf(n)<0) front.push(n);
      }
    }
    front.sort(function(a,b){return a-b;});
    if(front.length>=FRONT_MIN || limit>=4) break;
    front=[];
  }
  // 超18则按宫得分高低裁到18
  if(front.length>FRONT_MAX){
    // 保留前4宫的号码，若仍超则按号码所在宫得分排序后裁
    var keep=new Set();
    for(var i=0;i<4;i++){
      var g=sorted[i].g;
      for(var j=0;j<front.length;j++){
        if(numToGong(front[j])===g)keep.add(front[j]);
      }
    }
    var rest=[];
    for(var j=0;j<front.length;j++){if(!keep.has(front[j]))rest.push(front[j]);}
    rest.sort(function(a,b){return pan.palaceData[numToGong(b)].score-pan.palaceData[numToGong(a)].score;});
    var cur=Array.from(keep);
    for(var j=0;j<rest.length && cur.length<FRONT_MAX;j++)cur.push(rest[j]);
    front=cur.sort(function(a,b){return a-b;});
  }

  // 后区：五行生克打分排序，取前6位
  var baseWx=ganWuxing[pan.gz.dayGan];
  var rel=wuxingMap[baseWx];
  var scored=[];
  for(var n=1;n<=backMax;n++){
    var bwx=numWuxing(n); if(!bwx)continue;
    var s=0;
    if(bwx===rel.shengWo)s+=6;
    else if(bwx===rel.tong)s+=4;
    else if(bwx===rel.woSheng)s+=2;
    else if(bwx===rel.woKe)s+=1;
    else s-=3;
    scored.push({num:n,wx:bwx,score:s});
  }
  scored.sort(function(a,b){return b.score-a.score;});
  var back=scored.slice(0,BACK_MAX).map(function(x){return x.num;});

  return{front:front,back:back,scored:scored,topGongs:sorted.slice(0,4).map(function(x){return x.g;})};
}

// ========== 推荐5注 ==========
function recommendBets(pan,pool,lotteryType){
  var front=pool.front.slice(),back=pool.back.slice();
  var fNeed = lotteryType==="dlt" ? 5 : 6;
  var bNeed = lotteryType==="dlt" ? 2 : 1;
  var bets=[];
  for(var i=0;i<5;i++){
    var f=[],b=[],usedF={},usedB={};
    var idx=i;
    for(var j=0;j<fNeed;j++){
      var pos=(idx+j*3)%front.length;
      var tries=0;
      while(usedF[pos]&&tries<front.length){pos=(pos+1)%front.length;tries++;}
      usedF[pos]=true;f.push(front[pos]);idx++;
    }
    f.sort(function(a,b){return a-b;});
    for(var j=0;j<bNeed;j++){
      var pos=(i+j*2)%back.length;
      var tries=0;
      while(usedB[pos]&&tries<back.length){pos=(pos+1)%back.length;tries++;}
      usedB[pos]=true;b.push(back[pos]);
    }
    b.sort(function(a,b){return a-b;});
    bets.push({front:f,back:b});
  }
  return bets;
}

    betsDiv.appendChild(card);
  }
}

// ========== 等级判定 ==========
function judgeLevel(lt,hitRed,hitBlue){
  if(lt==="ssq"){
    if(hitRed===6&&hitBlue===1)return 1;
    if(hitRed===6)return 2;
    if(hitRed===5&&hitBlue===1)return 3;
    if(hitRed===5||(hitRed===4&&hitBlue===1))return 4;
    if(hitRed===4||(hitRed===3&&hitBlue===1))return 5;
    if(hitBlue===1)return 6;
    return 0;
  } else {
    if(hitRed===5&&hitBlue===2)return 1;
    if(hitRed===5&&hitBlue===1)return 2;
    if(hitRed===5||(hitRed===4&&hitBlue===2))return 3;
    if((hitRed===4&&hitBlue===1)||(hitRed===3&&hitBlue===2))return 4;
    if(hitRed===4||(hitRed===3&&hitBlue===1)||(hitRed===2&&hitBlue===2))return 5;
    if(hitRed===3||(hitRed===2&&hitBlue===1)||(hitRed===1&&hitBlue===2))return 6;
    return 0;
  }
}

// ========== 主流程 ==========
function run(){

  var baseType=document.getElementById("baseTarget").value;
  if(!dateStr){alert("请选择日期");return;}
  var pan=qiMenZhuanPan(dateStr,shiIdx);
  calcScore(pan.palaceData,pan.gz,pan.hourGan,pan.zhiFuGong,baseType);
  var pool=getNumPool(pan,lt);
  var bets=recommendBets(pan,pool,lt);
  document.getElementById("outputArea").style.display="block";
  renderPan(pan);
  renderPoolAndBets(pan,pool,bets,lt);
  document.getElementById("checkResult").innerHTML="";
  document.getElementById("batchResult").innerHTML="";
  window._lastPan=pan;
  window._lastPool=pool;
  window._lastBets=bets;
  window._lastLotteryType=lt;
}

// ========== 单期自查 ==========
function checkAward(){
  var input=document.getElementById("awardInput").value.trim();
  if(!input){alert("请输入开奖号码");return;}
  var parts=input.split("+");
  if(parts.length<2){alert("格式：红球空格分隔 + 蓝球");return;}
  var reds=parts[0].trim().split(/\s+/).map(Number);
  var blues=parts[1].trim().split(/\s+/).map(Number);
  var pan=window._lastPan,pool=window._lastPool,bets=window._lastBets,lt=window._lastLotteryType;
  if(!pan){alert("请先排盘");return;}
  var resultDiv=document.getElementById("checkResult");
  var html="";
  for(var i=0;i<bets.length;i++){
    var bet=bets[i];
    var hitRed=0,hitBlue=0;
    for(var j=0;j<bet.front.length;j++){if(reds.indexOf(bet.front[j])>=0)hitRed++;}
    for(var j=0;j<bet.back.length;j++){if(blues.indexOf(bet.back[j])>=0)hitBlue++;}
    var level=judgeLevel(lt,hitRed,hitBlue);
    var cls=level>=5?"good":(level>=3?"ok":"bad");
    html+='<div class="check-result '+cls+'">第'+(i+1)+'注：前区中'+hitRed+'个，后区中'+hitBlue+'个'+(level?'（等级'+level+'）':'')+'</div>';
  }
  resultDiv.innerHTML=html;
}

// ========== 批量自查 ==========
function batchCheck(){
  var text=document.getElementById("batchInput").value.trim();
  if(!text){alert("请输入历史开奖数据");return;}
  var lt=document.getElementById("lotteryType").value;
  var lines=text.split("\n");
  var resultDiv=document.getElementById("batchResult");
  var html='';
  var totalGood=0,totalOk=0;
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line)continue;
    var parts=line.split(" ");
    var dateStr=parts[0];
    var nums=parts.slice(1).join(" ");
    var np=nums.split("+");
    if(np.length<2)continue;
    var reds=np[0].trim().split(/\s+/).map(Number);
    var blues=np[1].trim().split(/\s+/).map(Number);
    var shiIdx=11;
    var pan=qiMenZhuanPan(dateStr,shiIdx);
    calcScore(pan.palaceData,pan.gz,pan.hourGan,pan.zhiFuGong,"riGan");
    var pool=getNumPool(pan,lt);
    var bets=recommendBets(pan,pool,lt);
    var bestLevel=0,bestHitRed=0,bestHitBlue=0;
    for(var b=0;b<bets.length;b++){
      var bet=bets[b];
      var hitRed=0,hitBlue=0;
      for(var j=0;j<bet.front.length;j++){if(reds.indexOf(bet.front[j])>=0)hitRed++;}
      for(var j=0;j<bet.back.length;j++){if(blues.indexOf(bet.back[j])>=0)hitBlue++;}
      var level=judgeLevel(lt,hitRed,hitBlue);
      if(level>bestLevel){bestLevel=level;bestHitRed=hitRed;bestHitBlue=hitBlue;}
    }
    var cls=bestLevel>=5?"good":(bestLevel>=3?"ok":"bad");
    if(bestLevel>=5)totalGood++;
    else if(bestLevel>=3)totalOk++;
    var badge='<span class="badge '+(cls==="good"?"badge-good":cls==="ok"?"badge-ok":"badge-bad")+'">'+(bestLevel?"L"+bestLevel:"无")+'</span>';
    html+='<div class="batch-row"><span class="period">'+dateStr+'</span><span class="result">前区中'+bestHitRed+' 后区中'+bestHitBlue+'</span>'+badge+'</div>';
  }
  html='<div class="summary-box">共'+lines.length+'期，中奖≥5级：'+totalGood+'期，中奖3-4级：'+totalOk+'期</div>'+html;
  resultDiv.innerHTML=html;
}
