<script>
"use strict";
/* =====================================================================
   奇门遁甲 时家转盘真盘引擎 v4.0 —— 完整真盘版
   ============================================================
   本文件为自包含单文件，不依赖任何外部脚本。
   结构（共 10 大模块）：
     1.  基础常量与数据表
     2.  天文计算：太阳黄经、二十四节气（Meeus 算法 + 牛顿迭代）
     3.  干支历：年/月/日/时四柱（年柱立春换年，月柱五虎遁，时柱五鼠遁）
     4.  拆补法定局：符头起三元，定阴阳遁与局数
     5.  地盘：三奇六仪依局数飞布，阳顺阴逆，中五寄坤
     6.  旬首：时柱旬首与对应六仪
     7.  天盘九星：值符随时干
     8.  人盘八门：值使随时支
     9.  神盘八神：阳顺阴逆
     10. 评分、号码池、推荐注、回测、UI 渲染
   排盘口径：
     - 预测彩票不使用天干克应（仅取九星五行与地盘宫五行的直接生克）
     - 星生宫 +10，星克宫 -8，宫克星 0，宫生星 0
     - 星伏吟（天盘星落本宫）+10
     - 旬空宫 -6
   ===================================================================== */

/* ============================ 1. 基础常量 ============================ */
const TG = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const DZ = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const TG_WX = {甲:"木",乙:"木",丙:"火",丁:"火",戊:"土",己:"土",庚:"金",辛:"金",壬:"水",癸:"水"};

/* 九宫地盘五行（中五寄坤，归 2 宫） */
const GX = {1:"水",2:"土",3:"木",4:"木",5:"土",6:"金",7:"金",8:"土",9:"火"};

/* 九星五行（天禽属土，随天芮寄坤） */
const STAR_WX = {"蓬":"水","芮":"土","冲":"木","辅":"木","禽":"土","心":"金","柱":"金","任":"土","英":"火"};
const STAR_FULL = {"蓬":"天蓬","芮":"天芮","冲":"天冲","辅":"天辅","禽":"天禽","心":"天心","柱":"天柱","任":"天任","英":"天英"};

/* 九星本位（洛书原位） */
const STAR_HOME = {1:"蓬",2:"芮",3:"冲",4:"辅",5:"禽",6:"心",7:"柱",8:"任",9:"英"};

/* 九星转盘环序（顺时针） */
const STAR_LOOP = ["蓬","芮","冲","辅","禽","心","柱","任","英"];

/* 八门本位 */
const DOOR_HOME = {1:"休",2:"死",3:"伤",4:"杜",6:"开",7:"惊",8:"生",9:"景"};

/* 八门转盘环序（顺时针） */
const DOOR_LOOP = ["休","生","伤","杜","景","死","惊","开"];

/* 八神（阳遁顺排） */
const GOD_YANG = ["值符","螣蛇","太阴","六合","白虎","玄武","九地","九天"];
/* 八神（阴遁逆排） */
const GOD_YIN  = ["值符","九天","九地","玄武","白虎","六合","太阴","螣蛇"];

/* 三奇六仪飞布队列：戊己庚辛壬癸丁丙乙 */
const LIUYI = ["戊","己","庚","辛","壬","癸","丁","丙","乙"];

/* 旬首对应六仪：甲子戊、甲戌己、甲申庚、甲午辛、甲辰壬、甲寅癸 */
const XUN_LIUYI = ["戊","己","庚","辛","壬","癸"];

/* 60 甲子 */
const JZ = (function(){var a=[];for(var i=0;i<60;i++)a.push(TG[i%10]+DZ[i%12]);return a;})();

/* 八宫次序（含中五，渲染时中五寄坤） */
const GONG_ALL = [1,2,3,4,5,6,7,8,9];
/* 八宫次序（不含中五，中五寄坤二） */
const GONG = [1,2,3,4,6,7,8,9];

/* 宫位所藏地支（旬空判定用） */
const GONG_ZHI = {
  1:["子"],
  2:["未","申"],
  3:["卯"],
  4:["辰","巳"],
  6:["戌","亥"],
  7:["酉"],
  8:["丑","寅"],
  9:["午"]
};

/* 宫数合一映射：数 -> 落宫（含 0 结尾归中五宫） */
const NUM2GONG = (function(){
  var m={};
  var i;
  // 1 尾数：1 11 21 31 -> 1 宫
  m[1]=1;m[11]=1;m[21]=1;m[31]=1;
  // 2 尾数：2 12 22 32 -> 2 宫
  m[2]=2;m[12]=2;m[22]=2;m[32]=2;
  // 3 尾数：3 13 23 33 -> 3 宫
  m[3]=3;m[13]=3;m[23]=3;m[33]=3;
  // 4 尾数：4 14 24 -> 4 宫
  m[4]=4;m[14]=4;m[24]=4;
  // 5 尾数：5 15 25 35 -> 中五宫（寄 2）
  m[5]=5;m[15]=5;m[25]=5;m[35]=5;
  // 6 尾数：6 16 26 -> 6 宫
  m[6]=6;m[16]=6;m[26]=6;
  // 7 尾数：7 17 27 -> 7 宫
  m[7]=7;m[17]=7;m[27]=7;
  // 8 尾数：8 18 28 -> 8 宫
  m[8]=8;m[18]=8;m[28]=8;
  // 9 尾数：9 19 29 -> 9 宫
  m[9]=9;m[19]=9;m[29]=9;
  // 0 结尾：10 20 30 -> 中五宫（寄 2）
  m[10]=5;m[20]=5;m[30]=5;
  return m;
})();

/* 九宫洛书序（渲染次序：4 9 2 / 3 5 7 / 8 1 6） */
const LUO_ORDER = [4,9,2,3,5,7,8,1,6];

/* 二十四节气（按黄经 15° 一节的顺序，共 24） */
const JIEQI_NAME = [
  "小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨",
  "立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑",
  "白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至"
];

/* 拆补法定局表（三元）——《奇门遁甲统宗》所载
   键为节气名，值为 [上元局, 中元局, 下元局]（阳遁）
   阴遁节气则在计算时取 10 - 局数 */
const YANG_JU = {
  "冬至":[1,7,4],"小寒":[2,8,5],"大寒":[3,9,6],
  "立春":[8,5,2],"雨水":[9,6,3],"惊蛰":[1,7,4],
  "春分":[3,9,6],"清明":[4,1,7],"谷雨":[5,2,8],
  "立夏":[4,1,7],"小满":[5,2,8],"芒种":[6,3,9]
};
const YIN_JU = {
  "夏至":[9,3,6],"小暑":[8,2,5],"大暑":[7,1,4],
  "立秋":[2,5,8],"处暑":[1,4,7],"白露":[9,3,6],
  "秋分":[7,1,4],"寒露":[6,9,3],"霜降":[5,8,2],
  "立冬":[6,9,3],"小雪":[5,8,2],"大雪":[4,7,1]
};

/* 阴阳遁节气划分
   冬至后夏至前（含冬至）为阳遁
   夏至后冬至前（含夏至）为阴遁 */
function isYangJieQi(name){
  var yang = ["冬至","小寒","大寒","立春","雨水","惊蛰",
              "春分","清明","谷雨","立夏","小满","芒种"];
  return yang.indexOf(name) >= 0;
}

/* ============================ 2. 天文计算 ============================ */

/**
 * 将日期（年、月、日、时、分）转换为儒略日（JD）
 * 使用 Fliegel & Van Flandern 公式，精度满足历法需求
 * 返回值以中午（12:00）为日界起算
 */
function dateToJD(y,m,d,h,mi){
  h = h || 0; mi = mi || 0;
  var a = Math.floor((14 - m) / 12);
  var yy = y + 4800 - a;
  var mm = m + 12 * a - 3;
  var jdn = d + Math.floor((153 * mm + 2) / 5) + 365 * yy
          + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
  // 以中午（12:00）为日界，加时分修正
  return jdn + (h - 12) / 24.0 + mi / 1440.0;
}

/**
 * 计算给定儒略日太阳在平黄道上的黄经（度）
 * 使用 Meeus 天文算法（低精度公式，误差 < 0.01°）
 */
function sunLongitude(jd){
  var n, L, g, lambda;
  // 自 J2000.0 起算的儒略世纪数
  var T = (jd - 2451545.0) / 36525.0;
  // 太阳平黄经
  L = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  // 太阳平近点角
  g = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
  // 转为弧度
  var gr = g * Math.PI / 180.0;
  // 中心差（偏心近点角修正）
  var C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(gr)
        + (0.019993 - 0.000101 * T) * Math.sin(2 * gr)
        + 0.000289 * Math.sin(3 * gr);
  // 真黄经
  lambda = L + C;
  // 黄经章动修正
  var Omega = 125.04 - 1934.136 * T;
  lambda = lambda - 0.00569 - 0.00478 * Math.sin(Omega * Math.PI / 180.0);
  // 归一化到 [0, 360)
  lambda = lambda - Math.floor(lambda / 360.0) * 360.0;
  if(lambda < 0) lambda += 360.0;
  return lambda;
}

/**
 * 二分法求节气时刻
 * targetLon: 目标太阳黄经（度）
 * jdGuess:   初始猜测儒略日
 * 返回该黄经对应的儒略日
 */
function findJieQiJD(targetLon, jdGuess){
  var jd = jdGuess;
  var lambda, diff, deriv, step;
  for(var i=0;i<50;i++){
    lambda = sunLongitude(jd);
    diff = targetLon - lambda;
    // 将差值归一到 (-180, 180]
    diff = diff - Math.floor((diff + 180.0) / 360.0) * 360.0;
    if(diff > 180.0) diff -= 360.0;
    if(diff < -180.0) diff += 360.0;
    // 数值微分求导数（dλ/dJD）
    var h = 1e-5;
    deriv = (sunLongitude(jd + h) - sunLongitude(jd - h)) / (2 * h);
    if(Math.abs(deriv) < 1e-10) break;
    step = diff / deriv;
    // 限制步长，防止跨周期跳跃（太阳日行约1°）
    if(step > 30) step = 30;
    if(step < -30) step = -30;
    jd = jd + step;
    if(Math.abs(step) < 1e-7) break;
  }
  return jd;
}

/**
 * 获取指定年份全部 24 节气的精确时刻（Date 对象，UTC）
 * 先估算各节气日期，再用牛顿迭代精修
 */
function getAllJieQiOfYear(year){
  // 节气近似日期（每月约 2 个节气）
  var approx = [
    [1,6],[1,20],[2,4],[2,19],[3,6],[3,21],
    [4,5],[4,20],[5,6],[5,21],[6,6],[6,21],
    [7,7],[7,23],[8,8],[8,23],[9,8],[9,23],
    [10,8],[10,23],[11,7],[11,22],[12,7],[12,22]
  ];
  // 小寒黄经约 285°，之后每节递增 15°
  var startLon = 285;
  var result = {};
  for(var i=0;i<24;i++){
    var targetLon = (startLon + i * 15.0) % 360.0;
    var mn = approx[i][0], dy = approx[i][1];
    // 迭代初值：使用该节气当年近似日期
    var ay = year;
    var jdGuess = dateToJD(ay, mn, dy, 0, 0);
    var jd = findJieQiJD(targetLon, jdGuess);
    // 若结果跨年过大，从相邻年份重试
    var dt = jdToDate(jd);
    if(dt.year < year - 1 || dt.year > year + 1){
      jdGuess = dateToJD(year, mn, dy, 0, 0);
      jd = findJieQiJD(targetLon, jdGuess);
    }
    result[JIEQI_NAME[i]] = jdToDate(jd);
  }
  return result;
}

/** 儒略日转 Date（UTC） */
function jdToDate(jd){
  var Z = Math.floor(jd + 0.5);
  var F = (jd + 0.5) - Z;
  var A = Z;
  if(Z >= 2299161){
    var alpha = Math.floor((Z - 1867216.25) / 36524.25);
    A = Z + 1 + alpha - Math.floor(alpha / 4);
  }
  var B = A + 1524;
  var C = Math.floor((B - 122.1) / 365.25);
  var D = Math.floor(365.25 * C);
  var E = Math.floor((B - D) / 30.6001);
  var day = B - D - Math.floor(30.6001 * E) + F;
  var month = E < 14 ? E - 1 : E - 13;
  var year = month > 2 ? C - 4716 : C - 4715;
  var d0 = Math.floor(day);
  var h = Math.floor((day - d0) * 24);
  var mi = Math.floor(((day - d0) * 24 - h) * 60);
  var s = Math.floor((((day - d0) * 24 - h) * 60 - mi) * 60);
  return new Date(Date.UTC(year, month - 1, d0, h, mi, s));
}

/**
 * 获取给定时刻所处的当前节气
 * 返回节气名称（字符串）
 */
function getActiveJieQi(date){
  var y = date.getUTCFullYear();
  var years = [y-1, y, y+1];
  var all = [];
  for(var yi=0;yi<years.length;yi++){
    var tbl = getAllJieQiOfYear(years[yi]);
    var keys = Object.keys(tbl);
    for(var ki=0;ki<keys.length;ki++){
      all.push({name:keys[ki], t:tbl[keys[ki]].getTime()});
    }
  }
  all.sort(function(a,b){return a.t - b.t;});
  var now = date.getTime();
  var cur = all[0].name;
  for(var i=0;i<all.length;i++){
    if(all[i].t <= now) cur = all[i].name;
    else break;
  }
  return cur;
}

/* ============================ 3. 干支历 ============================ */

/**
 * 计算儒略日（中午起算，便于日柱推算）
 */
function julianDayNoon(y,m,d){
  var a = Math.floor((14 - m) / 12);
  var yy = y + 4800 - a;
  var mm = m + 12 * a - 3;
  return d + Math.floor((153 * mm + 2) / 5) + 365 * yy
       + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
}

/**
 * 日柱：以当日中午儒略日起算
 * 基准：儒略日 0 对应 西元前 4713 年 1 月 1 日，其日柱为 辛亥
 * 使用 甲子日索引 = 10 反推
 * 返回 {gan, zhi, gz, idx}
 */
function getDayGanZhi(date){
  var y = date.getUTCFullYear();
  var m = date.getUTCMonth() + 1;
  var d = date.getUTCDate();
  var h = date.getUTCHours();
  // 晚子时（23 点后）日柱归次日
  if(h >= 23){
    var nd = new Date(date.getTime() + 86400000);
    y = nd.getUTCFullYear();
    m = nd.getUTCMonth() + 1;
    d = nd.getUTCDate();
  }
  var jd = julianDayNoon(y, m, d);
  // 日柱基准：JD 1 对应日柱索引（经验校准：以 1900-01-01 为 甲戌 日，即 idx=10）
  // 公式：idx = (jd + 49) % 60，对应 甲子=0
  var base = 49; // 1900-01-01 的校准偏移
  var idx = ((jd - 1 + base) % 60 + 60) % 60;
  return {gan:TG[idx % 10], zhi:DZ[idx % 12], gz:JZ[idx], idx:idx};
}

/**
 * 年柱：以立春为换年节点
 * 返回年柱干支字符串
 */
function getYearGanZhi(date){
  var y = date.getUTCFullYear();
  var jqTbl = getAllJieQiOfYear(y);
  var lichun = jqTbl["立春"];
  var realYear;
  if(date.getTime() >= lichun.getTime()){
    realYear = y;
  }else{
    realYear = y - 1;
  }
  // 1984 年为甲子年（idx=0）
  var idx = ((realYear - 1984) % 60 + 60) % 60;
  return JZ[idx];
}

/**
 * 月柱：以节气换月（非农历月），用五虎遁起月干
 * 五虎遁：甲己之年丙作首，乙庚之岁戊为头，丙辛必定寻庚起，丁壬壬位顺行流，若问戊癸何方发，甲寅之上好追求
 * 返回月柱干支字符串
 */
function getMonthGanZhi(date){
  var jq = getActiveJieQi(date);
  // 节气序（0 小寒 ... 23 冬至）
  var jqIdx = JIEQI_NAME.indexOf(jq);
  // 月支：从寅月起算，小寒起寅
  var monthZhiIdx = (Math.floor(jqIdx / 2) + 2) % 12; // +2 使 寅=2
  var monthZhi = DZ[monthZhiIdx];
  // 年干
  var ygz = getYearGanZhi(date);
  var yGanIdx = TG.indexOf(ygz.charAt(0));
  // 五虎遁起点（寅月天干）
  var tiger = {0:2, 1:4, 2:6, 3:8, 4:0, 5:2, 6:4, 7:6, 8:8, 9:0};
  var start = tiger[yGanIdx];
  // 寅月起始天干为 start，卯月 start+1 ...
  // 节气序/2 = 月序（寅月起为 0）
  var monthOrd = Math.floor(jqIdx / 2);
  var ganIdx = (start + monthOrd) % 10;
  return TG[ganIdx] + monthZhi;
}

/**
 * 时柱：以时支定宫，五鼠遁起时干
 * 五鼠遁：甲己还加甲，乙庚丙作初，丙辛从戊起，丁壬庚子居，戊癸何方发，壬子是真途
 * shiIdx: 0 子时 ... 11 亥时
 * 返回时柱干支字符串
 */
function getHourGanZhi(date, shiIdx){
  var dz = getDayGanZhi(date);
  var dayGanIdx = TG.indexOf(dz.gan);
  var rat = {0:0, 1:2, 2:4, 3:6, 4:8, 5:0, 6:2, 7:4, 8:6, 9:8};
  var start = rat[dayGanIdx];
  var ganIdx = (start + shiIdx) % 10;
  return TG[ganIdx] + DZ[shiIdx];
}

/**
 * 完整四柱
 */
function getFourPillars(date, shiIdx){
  return {
    year:  getYearGanZhi(date),
    month: getMonthGanZhi(date),
    day:   getDayGanZhi(date),
    hour:  getHourGanZhi(date, shiIdx)
  };
}

/* ============================ 4. 拆补法定局 ============================ */

/**
 * 向前查找最近的符头（甲日或己日）
 * 符头：甲子、甲午、己卯、己酉（上元）；甲寅、甲申、己巳、己亥（中元）；甲辰、甲戌、己丑、己未（下元）
 * 简化：逢甲、己即为符头
 */
function findFuTou(dayGz){
  var idx = JZ.indexOf(dayGz);
  var cur = idx;
  for(var i=0;i<60;i++){
    var g = TG[cur % 10];
    if(g === "甲" || g === "己") return JZ[cur];
    cur = cur - 1;
    if(cur < 0) cur += 60;
  }
  return JZ[idx];
}

/**
 * 由符头地支定三元
 * 子午卯酉 -> 上元
 * 寅申巳亥 -> 中元
 * 辰戌丑未 -> 下元
 */
function getYuan(fuTouGz){
  var zhi = fuTouGz.charAt(1);
  if(zhi === "子" || zhi === "午" || zhi === "卯" || zhi === "酉") return 0;
  if(zhi === "寅" || zhi === "申" || zhi === "巳" || zhi === "亥") return 1;
  return 2;
}

/**
 * 拆补法定局
 * 返回 {jieqi, yinyang, yuan, ju, fuTou}
 */
function dingJu(date){
  var jq = getActiveJieQi(date);
  var yinyang = isYangJieQi(jq) ? "阳" : "阴";
  var tbl = yinyang === "阳" ? YANG_JU : YIN_JU;
  var dayGz = getDayGanZhi(date).gz;
  var fuTou = findFuTou(dayGz);
  var yuan = getYuan(fuTou);
  var ju = tbl[jq][yuan];
  return {
    jieqi: jq,
    yinyang: yinyang,
    yuan: ["上元","中元","下元"][yuan],
    ju: ju,
    fuTou: fuTou
  };
}

/* ============================ 5. 地盘三奇六仪 ============================ */

/**
 * 布地盘：依局数飞布三奇六仪
 * 几局戊起几宫，阳顺阴逆
 * 中五无位，寄于坤二
 * 返回 {宫: 天干}
 */
function buildDiPan(ju, yinyang){
  var dp = {};
  // 地盘用八宫次序（1,2,3,4,6,7,8,9）
  var pos = GONG.slice();
  // 戊起始宫位：几局戊起几宫，5 局戊寄坤（2 宫）
  var startJu = (ju === 5) ? 2 : ju;
  var startIdx = pos.indexOf(startJu);
  for(var i=0;i<9;i++){
    var p;
    if(yinyang === "阳"){
      p = pos[(startIdx + i) % 8];
    }else{
      p = pos[(startIdx - i + 8) % 8];
    }
    // 中五寄坤
    if(p === 5) p = 2;
    dp[p] = LIUYI[i];
  }
  return dp;
}

/**
 * 查找某天干在地盘中所落的宫位
 */
function findGanInDiPan(dp, gan){
  var keys = Object.keys(dp);
  for(var i=0;i<keys.length;i++){
    if(dp[keys[i]] === gan) return parseInt(keys[i], 10);
  }
  return 2; // 默认寄坤
}

/* ============================ 6. 旬首 ============================ */

/**
 * 求时柱的旬首
 * 时柱干支往前推到六甲（甲子、甲戌、甲申、甲午、甲辰、甲寅）
 * 返回 {xsGz, xsGan, xsZhi, liuyi, xsIdx, xuIdx}
 */
function getXunShou(hourGz){
  var idx = JZ.indexOf(hourGz);
  var cur = idx;
  var xsIdx;
  for(var i=0;i<12;i++){
    if(TG[cur % 10] === "甲"){
      xsIdx = cur;
      break;
    }
    cur = cur - 1;
    if(cur < 0) cur += 60;
  }
  var xuIdx = Math.floor(xsIdx / 10) % 6;
  return {
    xsGz:   JZ[xsIdx],
    xsGan:  TG[xsIdx % 10],
    xsZhi:  DZ[xsIdx % 12],
    liuyi:  XUN_LIUYI[xuIdx],
    xsIdx:  xsIdx,
    xuIdx:  xuIdx
  };
}

/* ============================ 7. 天盘九星 ============================ */

/**
 * 排天盘九星：值符随时干
 * 步骤：
 *  1. 以旬首所落宫的本位星为值符星
 *  2. 值符星随时干落宫（值符转到时干所在宫）
 *  3. 其余八星按 STAR_LOOP 环序顺布八宫
 * 返回 {宫: 星简称}  例 {1:"蓬", 2:"禽", ...}
 */
function buildTianPanStar(dp, dj, hourGz, yinyang){
  var tp = {};
  // 旬首
  var xs = getXunShou(hourGz);
  // 旬首所落宫（在地盘中查找旬首对应的六仪）
  var xsGong = findGanInDiPan(dp, xs.liuyi);
  if(xsGong === 5) xsGong = 2;
  // 值符星 = 旬首宫的本位星
  var zfStar = STAR_HOME[xsGong];
  // 时干
  var shiGan = hourGz.charAt(0);
  // 时干落宫
  var shiGong = findGanInDiPan(dp, shiGan);
  if(shiGong === 5) shiGong = 2;
  // 九星环序中值符星的位置
  var zfLoopIdx = STAR_LOOP.indexOf(zfStar);
  // 值符随时干：值符星落到时干宫
  // 其余星按环序布（阳顺阴逆）
  var pos = GONG.slice(); // 1,2,3,4,6,7,8,9
  var shiPosIdx = pos.indexOf(shiGong);
  for(var i=0;i<8;i++){
    var g;
    if(yinyang === "阳"){
      g = pos[(shiPosIdx + i) % 8];
    }else{
      g = pos[(shiPosIdx - i + 8) % 8];
    }
    var star = STAR_LOOP[(zfLoopIdx + i) % 9];
    tp[g] = star;
  }
  // 中五宫：天禽寄坤二，天禽随天芮同宫
  tp[5] = "禽";
  return tp;
}

/* ============================ 8. 人盘八门 ============================ */

/**
 * 排人盘八门：值使随时支
 * 步骤：
 *  1. 以旬首所落宫的本位门为值使门
 *  2. 从旬首地支数到时支（阳顺阴逆），得出值使落宫
 *  3. 其余八门按 DOOR_LOOP 环序顺布
 * 返回 {宫: 门简称}
 */
function buildRenPanDoor(dp, dj, hourGz, shiZhiIdx, yinyang){
  var dm = {};
  var xs = getXunShou(hourGz);
  var xsGong = findGanInDiPan(dp, xs.liuyi);
  if(xsGong === 5) xsGong = 2;
  // 值使门 = 旬首宫的本位门
  var zsDoor = DOOR_HOME[xsGong];
  // 旬首地支序
  var xsZhiIdx = DZ.indexOf(xs.xsZhi);
  // 从旬首到时支的步数
  var steps;
  if(yinyang === "阳"){
    steps = (shiZhiIdx - xsZhiIdx + 12) % 12;
  }else{
    steps = (xsZhiIdx - shiZhiIdx + 12) % 12;
  }
  // 值使落宫 = 旬首宫 + steps（环行）
  var pos = GONG.slice();
  var xsPosIdx = pos.indexOf(xsGong);
  var zsGongIdx = (xsPosIdx + (yinyang === "阳" ? steps : -steps) + 8000) % 8;
  var zsGong = pos[zsGongIdx];
  // 八门环序中值使门的位置
  var zsLoopIdx = DOOR_LOOP.indexOf(zsDoor);
  // 值使随时支：值使门落到 zsGong
  for(var i=0;i<8;i++){
    var g;
    if(yinyang === "阳"){
      g = pos[(zsGongIdx + i) % 8];
    }else{
      g = pos[(zsGongIdx - i + 8) % 8];
    }
    var door = DOOR_LOOP[(zsLoopIdx + i) % 8];
    dm[g] = door;
  }
  // 中五宫寄坤，死门
  dm[5] = "死";
  return {doors: dm, zsGong: zsGong, zsDoor: zsDoor};
}

/* ============================ 9. 神盘八神 ============================ */

/**
 * 排神盘八神：值符随时干
 * 阳遁顺排，阴遁逆排
 * 返回 {宫: 神名}
 */
function buildShenPan(dp, dj, hourGz, zfGong, yinyang){
  var sp = {};
  var pos = GONG.slice();
  var zfPosIdx = pos.indexOf(zfGong);
  var godSeq = yinyang === "阳" ? GOD_YANG : GOD_YIN;
  for(var i=0;i<8;i++){
    var g;
    if(yinyang === "阳"){
      g = pos[(zfPosIdx + i) % 8];
    }else{
      g = pos[(zfPosIdx - i + 8) % 8];
    }
    sp[g] = godSeq[i];
  }
  // 中五宫寄坤
  sp[5] = sp[2];
  return sp;
}

/* ============================ 主排盘函数 ============================ */

/**
 * 完整排盘
 * date: Date 对象（UTC 日期）
 * shiIdx: 0 子时 ... 11 亥时
 * 返回完整盘面对象
 */
function paiPan(date, shiIdx){
  var four = getFourPillars(date, shiIdx);
  var dj   = dingJu(date);
  var dp   = buildDiPan(dj.ju, dj.yinyang);

  // 时干（用于值符随时干）
  var hourGz = four.hour;
  var shiGan = hourGz.charAt(0);
  var shiZhiIdx = shiIdx;

  // 天盘九星
  var tp = buildTianPanStar(dp, dj, hourGz, dj.yinyang);

  // 时干落宫（值符宫）
  var zfGong = findGanInDiPan(dp, shiGan);
  if(zfGong === 5) zfGong = 2;

  // 人盘八门
  var doorRes = buildRenPanDoor(dp, dj, hourGz, shiZhiIdx, dj.yinyang);

  // 神盘八神
  var sp = buildShenPan(dp, dj, hourGz, zfGong, dj.yinyang);

  // 旬空：旬首地支之后两位为空亡
  var xs = getXunShou(hourGz);
  var xsZhiIdx = DZ.indexOf(xs.xsZhi);
  var kongZhi1 = DZ[(xsZhiIdx + 10) % 12];
  var kongZhi2 = DZ[(xsZhiIdx + 11) % 12];
  var kongGong = [];
  var kz = [kongZhi1, kongZhi2];
  for(var ki=0;ki<kz.length;ki++){
    var keys = Object.keys(GONG_ZHI);
    for(var gi=0;gi<keys.length;gi++){
      var g = parseInt(keys[gi], 10);
      var zhiArr = GONG_ZHI[g];
      for(var zi=0;zi<zhiArr.length;zi++){
        if(zhiArr[zi] === kz[ki]){
          if(kongGong.indexOf(g) < 0) kongGong.push(g);
        }
      }
    }
  }

  // 旬首所落宫
  var xsGong = findGanInDiPan(dp, xs.liuyi);
  if(xsGong === 5) xsGong = 2;

  // 值符星
  var zfStar = STAR_HOME[zfGong];

  return {
    four:    four,
    dj:      dj,
    dp:      dp,        // 地盘
    tp:      tp,        // 天盘九星
    doors:   doorRes.doors,
    zsGong:  doorRes.zsGong,
    zsDoor:  doorRes.zsDoor,
    sp:      sp,        // 神盘
    zfGong:  zfGong,    // 值符宫
    zfStar:  zfStar,    // 值符星
    xs:      xs,        // 旬首信息
    xsGong:  xsGong,    // 旬首宫
    kongGong:kongGong,  // 旬空宫
    shiGong: zfGong,    // 时干落宫=值符宫
    shiGan:  shiGan
  };
}

/* ============================ 10-A. 评分 ============================ */

/** 星生宫判定 */
function starShengGong(sw, gw){
  return (sw==="木"&&gw==="火") || (sw==="火"&&gw==="土") ||
         (sw==="土"&&gw==="金") || (sw==="金"&&gw==="水") ||
         (sw==="水"&&gw==="木");
}
/** 星克宫判定 */
function starKeGong(sw, gw){
  return (sw==="木"&&gw==="土") || (sw==="土"&&gw==="水") ||
         (sw==="水"&&gw==="火") || (sw==="火"&&gw==="金") ||
         (sw==="金"&&gw==="木");
}

/**
 * 九宫评分（仅九星五行与地盘宫五行的直接生克）
 * 星生宫 +10
 * 星克宫 -8
 * 宫克星  0（力不减）
 * 宫生星  0（无作用）
 * 星伏吟 +10（天盘星落本宫）
 * 旬空   -6
 */
function scoreGongs(pan){
  var res = {};
  for(var i=0;i<GONG.length;i++){
    var g = GONG[i];
    var gg = (g === 5) ? 2 : g;           // 中五寄坤
    var starName = pan.tp[g];             // 天盘星简称
    var starWx = STAR_WX[starName];       // 星五行
    var gWx = GX[gg];                     // 地盘宫五行
    var sc = 0;
    if(starShengGong(starWx, gWx)){
      sc += 10;                           // 星生宫
    }else if(starKeGong(starWx, gWx)){
      sc -= 8;                            // 星克宫
    }
    // 宫克星 -> 0；宫生星 -> 0（均无作用）
    // 星伏吟：天盘星落本宫
    if(STAR_HOME[g] === starName){
      sc += 10;
    }
    // 旬空减分
    if(pan.kongGong.indexOf(g) >= 0){
      sc -= 6;
    }
    res[g] = sc;
  }
  return res;
}

/* ============================ 10-B. 号码池 ============================ */

/**
 * 获取基准宫（按选择）
 */
function getBaseGong(pan, baseType){
  if(baseType === "rigan"){
    return findGanInDiPan(pan.dp, pan.four.day.gan);
  }
  if(baseType === "shigan"){
    return pan.shiGong;
  }
  if(baseType === "zhifu"){
    return pan.zfGong;
  }
  if(baseType === "xiumen"){
    var keys = Object.keys(pan.doors);
    for(var i=0;i<keys.length;i++){
      if(pan.doors[keys[i]] === "休") return parseInt(keys[i], 10);
    }
    return 1;
  }
  if(baseType === "liuhe"){
    var k2 = Object.keys(pan.sp);
    for(var j=0;j<k2.length;j++){
      if(pan.sp[k2[j]] === "六合") return parseInt(k2[j], 10);
    }
    return 1;
  }
  return pan.zfGong;
}

/**
 * 构建号码池
 * lt: "dlt" 大乐透(35选5+12选2) / "ssq" 双色球(33选6+16选1)
 */
function buildPool(pan, baseType, lt){
  var cfg = (lt === "dlt")
    ? {frontMax:35, backMax:12, frontPick:5, backPick:2, frontNeed:16, backNeed:6}
    : {frontMax:33, backMax:16, frontPick:6, backPick:1, frontNeed:16, backNeed:6};

  var scores = scoreGongs(pan);

  // 前区：按宫得分降序取号
  var sortedGongs = GONG.slice().sort(function(a,b){return scores[b] - scores[a];});
  var front = [];
  var used = {};
  for(var gi=0;gi<sortedGongs.length;gi++){
    var g = sortedGongs[gi];
    var gg = (g === 5) ? 2 : g;
    var numKeys = Object.keys(NUM2GONG);
    for(var ni=0;ni<numKeys.length;ni++){
      var n = parseInt(numKeys[ni], 10);
      if(NUM2GONG[n] === gg && n <= cfg.frontMax && !used[n]){
        front.push(n);
        used[n] = true;
      }
    }
    if(front.length >= cfg.frontNeed) break;
  }
  // 补足前区候选（若不足 frontNeed）
  for(var fn=1;fn<=cfg.frontMax && front.length<cfg.frontNeed;fn++){
    if(!used[fn]){front.push(fn);used[fn]=true;}
  }
  // 前区候选数限制
  if(front.length > 18) front = front.slice(0, 18);

  // 后区：按得分取候选
  var back = [];
  for(var bi=0;bi<sortedGongs.length;bi++){
    var bg = sortedGongs[bi];
    var bgg = (bg === 5) ? 2 : bg;
    var bNumKeys = Object.keys(NUM2GONG);
    for(var bni=0;bni<bNumKeys.length;bni++){
      var bn = parseInt(bNumKeys[bni], 10);
      if(NUM2GONG[bn] === bgg && bn <= cfg.backMax && !used[bn]){
        back.push(bn);
        used[bn] = true;
      }
    }
    if(back.length >= cfg.backNeed) break;
  }
  for(var bn2=1;bn2<=cfg.backMax && back.length<cfg.backNeed;bn2++){
    if(!used[bn2]){back.push(bn2);used[bn2]=true;}
  }

  return {
    front: front,
    back: back,
    frontPick: cfg.frontPick,
    backPick: cfg.backPick,
    scores: scores
  };
}

/* ============================ 10-C. 推荐注 ============================ */

/** 洗牌 */
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/**
 * 生成 N 注推荐号码
 */
function genBets(pool, lt, count){
  count = count || 5;
  var bets = [];
  var usedBets = {};
  var tries = 0;
  while(bets.length < count && tries < 5000){
    tries++;
    var fp = shuffleArr(pool.front).slice(0, pool.frontPick).sort(function(a,b){return a-b;});
    var bp = shuffleArr(pool.back).slice(0, pool.backPick).sort(function(a,b){return a-b;});
    var key = fp.join(",") + "|" + bp.join(",");
    if(usedBets[key]) continue;
    usedBets[key] = true;
    bets.push({front:fp, back:bp});
  }
  return bets;
}

/* ============================ 回测系统 ============================ */

/**
 * 单期自查：比对开奖号与推荐注的命中数
 */
function checkBets(bets, openFront, openBack, lt){
  var res = [];
  for(var i=0;i<bets.length;i++){
    var hit = 0;
    for(var fi=0;fi<bets[i].front.length;fi++){
      if(openFront.indexOf(bets[i].front[fi]) >= 0) hit++;
    }
    var bhit = 0;
    for(var bi=0;bi<bets[i].back.length;bi++){
      if(openBack.indexOf(bets[i].back[bi]) >= 0) bhit++;
    }
    res.push({idx:i+1, hit:hit, bhit:bhit, total:hit+bhit});
  }
  return res;
}

/**
 * 批量回测：用历史数据验证号码池的命中分布
 * data: [{date, shiIdx, front:[], back:[]}]
 */
function runBacktestData(data, lt, baseType){
  var stats = {
    total: data.length,
    frontHitSum: 0,
    backHitSum: 0,
    bestFront: 0,
    bestTotal: 0,
    details: []
  };
  for(var i=0;i<data.length;i++){
    var item = data[i];
    var date = new Date(item.date + "T00:00:00Z");
    var shiIdx = item.shiIdx != null ? item.shiIdx : 11; // 默认亥时
    var pan = paiPan(date, shiIdx);
    var pool = buildPool(pan, baseType || "zhifu", lt);
    var bets = genBets(pool, lt, 5);
    var chk = checkBets(bets, item.front, item.back, lt);
    var fh=0, bh=0, mx=0;
    for(var j=0;j<chk.length;j++){
      fh += chk[j].hit;
      bh += chk[j].bhit;
      if(chk[j].total > mx) mx = chk[j].total;
    }
    var favg = fh / chk.length;
    stats.frontHitSum += favg;
    stats.backHitSum += bh;
    if(mx > stats.bestTotal) stats.bestTotal = mx;
    stats.details.push({date:item.date, front:favg, back:Math.round(bh/chk.length*10)/10, best:mx});
  }
  stats.frontAvg = stats.frontHitSum / stats.total;
  stats.backAvg = Math.round(stats.backHitSum / stats.total * 10) / 10;
  return stats;
}

function parseCustomData(text, lt){
  var lines = text.split("\n");
  var data = [];
  for(var i=0;i<lines.length;i++){
    var line = lines[i].trim();
    if(!line) continue;
    var parts = line.split(",");
    if(parts.length < 3) continue;
    var date = parts[0].trim();
    var front = parts[1].trim().split(/\s+/).map(function(x){return parseInt(x,10);});
    var back = parts[2].trim().split(/\s+/).map(function(x){return parseInt(x,10);});
    data.push({date:date, shiIdx:11, front:front, back:back});
  }
  return data;
}

}
